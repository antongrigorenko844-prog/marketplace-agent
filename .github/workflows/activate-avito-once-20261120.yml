name: Activate approved Avito Delivery accounting
on:
  push:
    branches: [main]
    paths: ['.github/workflows/activate-avito-once-20261120.yml']
permissions:
  contents: write
concurrency:
  group: marketplace-agent
  cancel-in-progress: false
jobs:
  activate:
    if: github.event.before == '969e08d4e3e9154eff933dfcb50d2e15b7ad778d' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Verify and record the approved order
        env:
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
          AVITO_LEDGER_KEY: ${{ secrets.AVITO_LEDGER_KEY }}
        shell: python
        run: |
          from pathlib import Path
          import json, re, sqlite3, subprocess, sys
          import openpyxl
          
          def levels():
              workbook = openpyxl.load_workbook('data/ozon_catalog.xlsx', read_only=True, data_only=True)
              try:
                  wanted = {'0am325091f', '0am325025D', '0am325091f-set'}
                  result = {r[0]: r[7] for r in workbook.active.values if r[0] in wanted}
                  if set(result) != wanted or any(type(v) is not int or v < 0 for v in result.values()):
                      raise SystemExit('catalog_verification_failed')
                  return result
              finally:
                  workbook.close()
          
          def run_checked(option, state):
              run = subprocess.run([sys.executable, '-B', 'main.py', option], capture_output=True, text=True)
              for line in reversed(run.stdout.splitlines()):
                  try:
                      result = json.loads(line)
                  except ValueError:
                      continue
                  if isinstance(result, dict):
                      if run.returncode == 0 and result.get('activation') == state:
                          return
                      error = result.get('error', '')
                      if isinstance(error, str) and re.fullmatch('[a-z0-9_]{1,110}', error):
                          raise SystemExit(error)
              raise SystemExit('activation_guard_or_runtime_error')
          
          with sqlite3.connect('file:data/orders_seen.db?mode=ro', uri=True) as database:
              if database.execute("select count(*) from processed_orders where source='avito_delivery'").fetchone()[0]:
                  raise SystemExit('prior_avito_booking_present')
          book = openpyxl.load_workbook('data/kits.xlsx', read_only=True, data_only=True)
          recipe = [(row[2], row[3]) for row in book.active.values if row[0] == '0am325091f-set']
          book.close()
          if sorted(recipe) != sorted([('0am325091f', 2), ('0am325025D', 2)]):
              raise SystemExit('approved_recipe_changed')
          before = levels()
          run_checked('--preview-avito-activation', 'would_activate')
          run_checked('--activate-avito-orders', 'activated')
          after = levels()
          expect = {'0am325091f': -2, '0am325025D': -2, '0am325091f-set': -1}
          if any(after[k] - before[k] != d for k,d in expect.items()):
              raise SystemExit('inventory_delta_mismatch')
          with sqlite3.connect('file:data/orders_seen.db?mode=ro', uri=True) as database:
              counts = database.execute("select count(*),sum(decremented) from processed_orders where source='avito_delivery'").fetchone()
              pending = database.execute('select count(*) from stock_pending').fetchone()[0]
              if counts != (1, 1) or pending or database.execute('select count(*) from avito_cutover').fetchone()[0] != 1:
                  raise SystemExit('ledger_verification_failed')
          print('AVITO_BOOKED ' + json.dumps({'before':before, 'after':after, 'units':1},sort_keys=True))
      - name: Save the verified ledger and shared catalog
        run: bash .github/scripts/save_data.sh data/orders_seen.db data/ozon_catalog.xlsx

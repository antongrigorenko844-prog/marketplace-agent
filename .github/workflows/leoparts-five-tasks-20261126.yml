name: LEOPARTS five-task verified continuation 20261126
on:
  push:
    branches: [main]
    paths: ['.github/workflows/leoparts-five-tasks-20261126.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: marketplace-agent
  cancel-in-progress: false
jobs:
  five-tasks:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q -r requirements.txt
      - name: Verify stock-policy and full offline regression suite
        run: python -m unittest discover -s tests
      - name: Verify live stock ledger conflicts, actual models, solenoid draft, Avito feeds and reviewed media
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
          YANDEX_MARKET_API_KEY: ${{ secrets.YANDEX_MARKET_API_KEY }}
          YANDEX_MARKET_BUSINESS_ID: ${{ secrets.YANDEX_MARKET_BUSINESS_ID }}
          YANDEX_MARKET_CAMPAIGN_ID: ${{ secrets.YANDEX_MARKET_CAMPAIGN_ID }}
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
        run: python -u scripts/leoparts_five_tasks_20261126.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leoparts-five-task-evidence-${{ github.run_id }}
          path: data/leoparts_five_tasks_20261126_result.json
          if-no-files-found: warn
          retention-days: 30

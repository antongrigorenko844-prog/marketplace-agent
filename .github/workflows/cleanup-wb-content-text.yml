name: Correct reviewed WB text warnings only
on: workflow_dispatch
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - env:
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
        run: python scripts/cleanup_wb_content_text.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wb-text-cleanup
          path: /tmp/wb-text-cleanup/

name: Publish six DQ200 offers on Market and update Avito videos
on: workflow_dispatch
permissions:
  contents: write
jobs:
  market:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt
      - env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          YANDEX_MARKET_API_KEY: ${{ secrets.YANDEX_MARKET_API_KEY }}
          YANDEX_MARKET_CAMPAIGN_ID: ${{ secrets.YANDEX_MARKET_CAMPAIGN_ID }}
        run: |
          python - <<'PY'
          import yandex_market_client as ym
          from openpyxl import load_workbook
          sku="0am325025x"
          biz=ym.get_business_id()
          _,camp=ym._creds()
          for f in ("master_control","ozon_catalog","wb_catalog"):
              s=load_workbook("data/"+f+".xlsx",read_only=True,data_only=True).active
              rows=s.values
              headers=next(rows)
              for row in rows:
                  if row[0]==sku:
                      print("DIM",f,[(k,v) for k,v in zip(headers,row) if any(term in str(k).lower() for term in ("габар","вес","длин","ширин","высот"))],flush=True)
          for method,path,body in [("GET",f"/v2/campaigns/{camp}",None),("GET",f"/v2/businesses/{biz}/warehouses",None),("GET",f"/v2/campaigns/{camp}/shipments",None),("POST",f"/v2/campaigns/{camp}/offers",{"offerIds":[sku]})]:
              try:
                  code,data=ym._request(method,path,json_body=body,timeout=15)
                  print("SHIP",path,code,str(data)[:5000],flush=True)
              except Exception as e: print("SHIP ERROR",str(e),flush=True)
          PY

name: Publish six DQ200 offers on Market and update Avito videos
on: workflow_dispatch
permissions:
  contents: write
jobs:
  market:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt
      - env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          YANDEX_MARKET_API_KEY: ${{ secrets.YANDEX_MARKET_API_KEY }}
          YANDEX_MARKET_CAMPAIGN_ID: ${{ secrets.YANDEX_MARKET_CAMPAIGN_ID }}
        run: |
          python - <<'PY'
          import yandex_market_client as ym
          sku="0am325025x"
          orders=ym.get_orders_since(days_back=29)
          found=[(o.get("creationDate"),o.get("status"),i.get("count")) for o in orders for i in o.get("items",[]) if str(i.get("offerId","")).lower()==sku]
          print("MATCH",len(orders),found,flush=True)
          _,c=ym._creds()
          print("OFFER",ym._request("POST",f"/v2/campaigns/{c}/offers",json_body={"offerIds":[sku]}),flush=True)
          PY

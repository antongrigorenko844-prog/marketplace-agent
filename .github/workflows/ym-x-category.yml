name: Publish six DQ200 offers on Market and update Avito videos
on: workflow_dispatch
permissions:
  contents: write
jobs:
  market:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt
      - env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          YANDEX_MARKET_API_KEY: ${{ secrets.YANDEX_MARKET_API_KEY }}
          YANDEX_MARKET_CAMPAIGN_ID: ${{ secrets.YANDEX_MARKET_CAMPAIGN_ID }}
        run: |
          python - <<'PY'
          import yandex_market_client as ym
          import time
          sku="0am325025x"
          biz=ym.get_business_id()
          _,camp=ym._creds()
          def call(path,body):
              code,data=ym._request("POST",path,json_body=body,timeout=20)
              assert code==200 and data.get("status")=="OK",data
              return data
          def mapping():
              row,=call(f"/v2/businesses/{biz}/offer-mappings",{"offerIds":[sku]})["result"]["offerMappings"]
              assert row["offer"]["offerId"]==sku
              return row
          def offer():
              row,=call(f"/v2/campaigns/{camp}/offers",{"offerIds":[sku]})["result"]["offers"]
              assert row["offerId"]==sku
              return row
          before=mapping()["offer"]
          old=offer()
          dims={**before["weightDimensions"],"length":40,"width":30,"height":30}
          print("BEFORE",before["weightDimensions"],old,flush=True)
          if before["weightDimensions"]!=dims:
              result=call(f"/v2/businesses/{biz}/offer-mappings/update",{"offerMappings":[{"offer":{"offerId":sku,"weightDimensions":dims}}]})
              print("UPDATE",result,flush=True)
              assert not any(x.get("errors") for x in result.get("results",[])),result
          for i in range(10):
              try:
                  current=mapping()
                  status=offer()
                  print("VERIFY",current["offer"].get("weightDimensions"),status,current.get("showcaseUrls"),flush=True)
                  assert status["basicPrice"]==old["basicPrice"]
                  if current["offer"].get("weightDimensions")==dims and status["status"]=="PUBLISHED" and not any("отгружать" in w["message"].lower() for w in status.get("warnings",[])): break
              except ym.YandexMarketError as error: print("RETRY",error,flush=True)
              if i<9: time.sleep(20)
          else: raise RuntimeError("Waiting for shipping restriction to clear")
          PY

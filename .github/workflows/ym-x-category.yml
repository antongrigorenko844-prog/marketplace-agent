name: Correct Market DQ200 category
on: workflow_dispatch
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt
      - env:
          YANDEX_MARKET_API_KEY: ${{ secrets.YANDEX_MARKET_API_KEY }}
          YANDEX_MARKET_CAMPAIGN_ID: ${{ secrets.YANDEX_MARKET_CAMPAIGN_ID }}
        run: |
          python - <<'PY'
          import time
          import yandex_market_client as ym
          biz = ym.get_business_id()
          _, campaign = ym._creds()
          pairs = {"0AM325473":"6t30","31705-X428B":"31705-1XF0C","317053TX0C":"31705-1XF0C"}
          def post(path,data):
              code, result = ym._request("POST",path,json_body=data)
              assert code == 200 and result.get("status") == "OK", (code,result)
              return result
          def mappings(ids):
              result=post(f"/v2/businesses/{biz}/offer-mappings",{"offerIds":ids})["result"]
              return {r["offer"]["offerId"]:r for r in result["offerMappings"]}
          def statuses(ids):
              result=post(f"/v2/campaigns/{campaign}/offers",{"offerIds":ids})["result"]
              return {r["offerId"]:r for r in result["offers"]}
          before = mappings(list(set(pairs)|set(pairs.values())))
          old = statuses(list(pairs))
          updates = []
          for sku, anchor in pairs.items():
              target = before[anchor]["mapping"]
              current = before[sku]["mapping"]
              print("PAIR",sku,before[sku]["offer"]["name"],anchor,before[anchor]["offer"]["name"],current["marketCategoryName"],target["marketCategoryName"],flush=True)
              assert target["marketCategoryName"] == "Запчасти для трансмиссии автомобиля"
              assert current["marketCategoryName"] in ("Двигатели автомобильные","Сцепление и компоненты","Запчасти для трансмиссии автомобиля")
              if current["marketCategoryId"] != target["marketCategoryId"]:
                  updates.append({"offerId":sku,"marketCategoryId":target["marketCategoryId"],"parameterValues":[{"parameterId":60134505,"value":sku}]})
          if updates:
              response=post(f"/v2/businesses/{biz}/offer-mappings/update",{"offerMappings":[{"offer":item} for item in updates]})
              print("UPDATE",response,flush=True)
              assert not any(r.get("errors") for r in response.get("results",[]))
          for attempt in range(4):
              after=mappings(list(pairs))
              live=statuses(list(pairs))
              complete=True
              for sku, anchor in pairs.items():
                  category=after[sku].get("mapping",{}).get("marketCategoryId")
                  status=live.get(sku,{})
                  assert status.get("basicPrice") == old.get(sku,{}).get("basicPrice"),sku
                  print("VERIFY",sku,category,status.get("status"),flush=True)
                  complete &= category == before[anchor]["mapping"]["marketCategoryId"]
              if complete: break
              time.sleep(15)
          PY

name: Publish six DQ200 offers on Market and update Avito videos
on: workflow_dispatch
permissions:
  contents: write
jobs:
  market:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt
      - env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          YANDEX_MARKET_API_KEY: ${{ secrets.YANDEX_MARKET_API_KEY }}
          YANDEX_MARKET_CAMPAIGN_ID: ${{ secrets.YANDEX_MARKET_CAMPAIGN_ID }}
        run: |
          python - <<'PY'
          import yandex_market_client as ym
          from datetime import date,timedelta
          _,c=ym._creds()
          root=f"/v2/campaigns/{c}"
          for method,path,data in [
              ("PUT",root+"/first-mile/shipments",{"dateFrom":str(date.today()-timedelta(days=7)),"dateTo":str(date.today()+timedelta(days=5))}),
              ("POST",root+"/offers",{"offerIds":["0am325025x","0am325025H","0am325025HX"]}),
              ("POST",root+"/offers/stocks",{"offerIds":["0am325025x"]}),
          ]:
              try:
                  code,out=ym._request(method,path,json_body=data,timeout=12)
                  if "first-mile" in path and code==200:
                      rows=out.get("result",{}).get("shipments",[])
                      out=[{k:v for k,v in row.items() if "order" not in k.lower()} for row in rows[:4]]
                  print("CHECK",code,out,flush=True)
              except Exception as e: print("ERROR",e,flush=True)
          PY

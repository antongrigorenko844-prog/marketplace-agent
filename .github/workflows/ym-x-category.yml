name: Audit live Ozon content scores
on: workflow_dispatch
permissions:
  contents: write
jobs:
  market:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt
      - env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import ozon_client as oz
          ids=["0am325025H","0am325025","0am325025x","0AM325587E"]
          p=oz.get_product_names(ids)
          print("SCORE",json.dumps(oz._post("/v1/product/rating-by-sku",{"skus":[x["sku"] for x in p]}),ensure_ascii=False),flush=True)
          for x in p:
              print("CARD",json.dumps({k:x.get(k) for k in ("offer_id","sku","name","primary_image","images","type_id","description_category_id","attributes","complex_attributes")},ensure_ascii=False),flush=True)
          PY

name: Verify content unit tests with the runner temporary directory
on:
  push:
    branches: ['ci/verify-content-tempdir-20261121']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Test the content boundary before accessing seller accounts
        env:
          TMPDIR: ${{ runner.temp }}
        run: python -m unittest discover -s tests -v

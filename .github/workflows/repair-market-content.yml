name: Restore Market content and verify ratings
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the approved repair before verification
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: marketplace-agent
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - env:
          YANDEX_MARKET_API_KEY: ${{ secrets.YANDEX_MARKET_API_KEY }}
          YANDEX_MARKET_CAMPAIGN_ID: ${{ secrets.YANDEX_MARKET_CAMPAIGN_ID }}
        run: python scripts/apply_market_content_repair.py ${{ inputs.apply && '' || '--verify-only' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: market-content-repair
          path: /tmp/market-content-repair/

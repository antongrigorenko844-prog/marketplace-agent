# Ручной запуск через GitHub Actions — так же, как в проекте realty-agent,
# потому что напрямую с вашего компьютера до API Ozon/WB/Avito достучаться
# нельзя, а у GitHub Actions есть полный доступ в интернет.
#
# Как запустить вручную: вкладка Actions -> marketplace-agent -> Run workflow ->
# выбрать команду из списка -> Run workflow.
#
# ОБЩИЙ СКЛАД (2026-09-13): помимо ручного запуска, этот workflow ещё
# запускается САМ по расписанию (см. "on.schedule" ниже) каждые 3 часа —
# в этом автоматическом прогоне (github.event_name == 'schedule') команда
# из выпадающего списка игнорируется, вместо неё всегда выполняется
# фиксированная цепочка sync-orders -> push-stock -> push-wb-stock: сначала
# списываются проданные с Ozon/WB товары из общего остатка ("Кол-во к
# продаже"/"Остаток, шт." в data/ozon_catalog.xlsx), потом обновлённое
# число рассылается обратно на обе площадки. Если отправлять нечего (никто
# не менял остаток) — это НЕ ошибка, шаг не должен становиться красным
# (см. "|| true" в шаге ниже). Чтобы полностью отключить автозапуск —
# закомментируйте/удалите блок "schedule:".
#
# Перед использованием (см. README):
# 1. Settings -> Secrets and variables -> Actions -> добавить секреты:
#    OZON_CLIENT_ID, OZON_API_KEY, WB_API_TOKEN, WB_WAREHOUSE_ID (позже),
#    WORDSTAT_API_KEY, WORDSTAT_FOLDER_ID (для сбора SEO-семантики, см. README)
# 2. Settings -> Actions -> General -> Workflow permissions ->
#    "Read and write permissions" (чтобы сохранять data/ обратно в репозиторий).

name: marketplace-agent

on:
  schedule:
    - cron: "0 */3 * * *"  # каждые 3 часа (UTC) — общий учёт остатков, см. пояснение выше
  workflow_dispatch:
    inputs:
      command:
        description: "Что запустить"
        required: true
        default: "test-ozon"
        type: choice
        options:
          - test-ozon
          - test-wb
          - fetch-ozon
          - fetch-wb
          - wb-warehouses
          - ozon-warehouses
          - build-ozon-catalog
          - attach-ozon-photos
          - download-ozon-photos
          - full-sync-ozon
          - build-master-control
          - sync-master-control
          - push-ozon-cards-dryrun
          - push-ozon-cards
          - compare-ozon-wb
          - build-wb-catalog
          - attach-wb-photos
          - full-sync-wb
          - push-wb-cards-dryrun
          - push-wb-cards
          - push-wb-price-dryrun
          - push-wb-price
          - build-ozon-new-template
          - attach-ozon-new-photos
          - push-ozon-new-cards-dryrun
          - push-ozon-new-cards
          - build-wb-new-template
          - push-wb-new-cards-dryrun
          - push-wb-new-cards
          - attach-avito-photos
          - build-avito-catalog
          - test-avito
          - fetch-avito-orders
          - list-avito-items
          - build-avito-item-map
          - save-avito-item-map
          - sync-orders
          - push-stock-dryrun
          - push-stock
          - push-wb-stock-dryrun
          - push-wb-stock
          - pull-ozon-stock
          - diag-ozon-product
          - test-wordstat
          - wordstat-collect
          - wordstat-collect-batch
      article:
        description: "Артикул товара (только для wordstat-collect)"
        required: false
        default: ""
        type: string
      seed_phrase:
        description: "Стартовая фраза(ы) для Wordstat, через ';' если несколько (только для wordstat-collect)"
        required: false
        default: ""
        type: string

concurrency:
  # Без этого GitHub Actions спокойно запускает ДВА (и больше) прогона этого
  # workflow одновременно, если его запустили дважды подряд (например,
  # случайно нажали "Run workflow" ещё раз, пока предыдущий прогон ещё не
  # закончился). Для wordstat-collect-batch это реально приводило к дублям:
  # оба прогона стартуют с одного и того же коммита, независимо решают, что
  # одни и те же фразы по первым артикулам в очереди — "новые", и оба
  # успешно пушат их в data/seo_keywords.xlsx до того, как второй прогон
  # вообще узнаёт об изменениях первого (см. чат: 561 дублирующаяся строка
  # ровно по первым 5 артикулам очереди). group ограничивает это ОДНИМ
  # прогоном за раз на весь workflow; cancel-in-progress: false — не
  # отменяет уже идущий прогон, а просто ставит новый в очередь следом, чтобы
  # не потерять/оборвать реальный сбор данных на середине.
  group: marketplace-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run command
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
          WB_WAREHOUSE_ID: ${{ secrets.WB_WAREHOUSE_ID }}
          OZON_WAREHOUSE_ID: ${{ secrets.OZON_WAREHOUSE_ID }}
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
          AVITO_SELLER_ADDRESS: ${{ secrets.AVITO_SELLER_ADDRESS }}
          WORDSTAT_API_KEY: ${{ secrets.WORDSTAT_API_KEY }}
          WORDSTAT_FOLDER_ID: ${{ secrets.WORDSTAT_FOLDER_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Автозапуск по расписанию: общий учёт остатков (Ozon+WB)"
            python main.py --sync-orders
            python main.py --push-stock || true
            python main.py --push-wb-stock || true
          else
            python main.py --${{ github.event.inputs.command }} \
              --article "${{ github.event.inputs.article }}" \
              --seed-phrase "${{ github.event.inputs.seed_phrase }}"
          fi

      - name: Save data/ back to repo
        if: always()
        run: |
          git config user.name "marketplace-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ photos/ || true
          git diff --cached --quiet || git commit -m "chore: update data [skip ci]"
          git push || true

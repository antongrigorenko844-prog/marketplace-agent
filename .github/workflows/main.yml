# Ручной запуск через GitHub Actions — так же, как в проекте realty-agent,
# потому что напрямую с вашего компьютера до API Ozon/WB/Avito достучаться
# нельзя, а у GitHub Actions есть полный доступ в интернет.
#
# Как запустить вручную: вкладка Actions -> marketplace-agent -> Run workflow ->
# выбрать команду из списка -> Run workflow.
#
# Здесь — только часто используемые команды (ежедневная работа). Разовые,
# диагностические и "сборочные" команды (шаблоны, dryrun-проверки,
# archive/unarchive, wordstat и т.п.) вынесены в отдельный workflow
# "marketplace-agent-tools" (файл tools.yml) — вкладка Actions -> он там
# отдельной кнопкой "Run workflow". Сама логика выполнения команды (checkout,
# установка зависимостей, запуск main.py, сохранение data/) общая для обоих
# файлов и лежит в run-command.yml (переиспользуемый workflow), чтобы не
# дублироваться.
#
# ОБЩИЙ СКЛАД (2026-09-13): помимо ручного запуска, этот workflow ещё
# запускается САМ по расписанию (см. "on.schedule" ниже) каждые 3 часа —
# в этом автоматическом прогоне (github.event_name == 'schedule') команда
# из выпадающего списка игнорируется, вместо неё всегда выполняется
# фиксированная цепочка sync-orders -> push-stock -> push-wb-stock ->
# build-avito-catalog: сначала списываются проданные с Ozon/WB товары из
# общего остатка ("Кол-во к продаже"/"Остаток, шт." в data/ozon_catalog.xlsx),
# потом обновлённое число рассылается обратно на Ozon и WB, а следом
# пересобирается и перезаливается по ПОСТОЯННОЙ ссылке data/avito_feed.xlsx —
# Avito сам подхватывает её по расписанию "Автозагрузка по ссылке" (настраивается
# один раз в личном кабинете, см. вывод build-avito-catalog), без ручной загрузки.
# Если отправлять/заливать нечего или нечего менять — это НЕ ошибка, шаг не
# должен становиться красным (см. "|| true" в шаге ниже). Чтобы полностью
# отключить автозапуск — закомментируйте/удалите блок "schedule:".
#
# Перед использованием (см. README):
# 1. Settings -> Secrets and variables -> Actions -> добавить секреты:
#    OZON_CLIENT_ID, OZON_API_KEY, WB_API_TOKEN, WB_WAREHOUSE_ID (позже),
#    WORDSTAT_API_KEY, WORDSTAT_FOLDER_ID (для сбора SEO-семантики, см. README)
# 2. Settings -> Actions -> General -> Workflow permissions ->
#    "Read and write permissions" (чтобы сохранять data/ обратно в репозиторий).

name: marketplace-agent

on:
  schedule:
    - cron: "0 */3 * * *"  # каждые 3 часа (UTC) — общий учёт остатков, см. пояснение выше
  repository_dispatch:
    types: [tilda-order]  # заказ с сайта (Тильда) -> Google Apps Script -> сюда, см. stock_sync.sync_tilda_order
  workflow_dispatch:
    inputs:
      command:
        description: "Что запустить (частые команды; остальное — в marketplace-agent-tools)"
        required: true
        default: "test-ozon"
        type: choice
        options:
          - test-ozon
          - test-wb
          - fetch-ozon
          - fetch-wb
          - full-sync-ozon
          - full-sync-wb
          - push-ozon-cards
          - push-wb-cards
          - push-photos
          - push-wb-price
          - push-stock
          - push-wb-stock
          - sync-orders
          - build-avito-catalog
          - build-tilda-catalog
          - push-new-product-all
          - launch-new-products
          - finish-new-product
          - push-ozon-new-cards
          - push-wb-new-cards
      article:
        description: "Артикул товара (если команда его требует)"
        required: false
        default: ""
        type: string
      seed_phrase:
        description: "Стартовая фраза(ы), через ';' (только для wordstat-команд — см. marketplace-agent-tools)"
        required: false
        default: ""
        type: string

concurrency:
  # Без этого GitHub Actions спокойно запускает ДВА (и больше) прогона
  # одновременно (в т.ч. между main.yml и tools.yml — обе пишут в data/ и
  # пушат в репозиторий), если запустили дважды подряд или совпало с
  # расписанием. Группа одна и та же в main.yml и tools.yml, поэтому они
  # тоже не пересекаются друг с другом. cancel-in-progress: false — не
  # отменяет уже идущий прогон, а ставит новый в очередь следом, чтобы не
  # потерять/оборвать реальный сбор данных на середине.
  group: marketplace-agent
  cancel-in-progress: false

jobs:
  scheduled-or-webhook:
    if: github.event_name == 'schedule' || github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run command
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
          WB_WAREHOUSE_ID: ${{ secrets.WB_WAREHOUSE_ID }}
          OZON_WAREHOUSE_ID: ${{ secrets.OZON_WAREHOUSE_ID }}
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
          AVITO_SELLER_ADDRESS: ${{ secrets.AVITO_SELLER_ADDRESS }}
          WORDSTAT_API_KEY: ${{ secrets.WORDSTAT_API_KEY }}
          WORDSTAT_FOLDER_ID: ${{ secrets.WORDSTAT_FOLDER_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TILDA_ORDER_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Автозапуск по расписанию: общий учёт остатков (Ozon+WB)"
            python main.py --sync-orders
            python main.py --push-stock || true
            python main.py --push-wb-stock || true
            python main.py --build-avito-catalog || true
          else
            echo "Заказ с сайта (Тильда) через вебхук"
            python main.py --sync-tilda-order
          fi

      - name: Save data/ back to repo
        if: always()
        run: |
          git config user.name "marketplace-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ photos/ || true
          git diff --cached --quiet || git commit -m "chore: update data [skip ci]"
          git push || true

  manual:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/run-command.yml
    secrets: inherit
    with:
      command: ${{ github.event.inputs.command }}
      article: ${{ github.event.inputs.article }}
      seed_phrase: ${{ github.event.inputs.seed_phrase }}

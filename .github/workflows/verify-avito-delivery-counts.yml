name: Read Avito Delivery order counts
on:
  push:
    branches: [verify/stock-count-20261120]
    paths: ['.github/workflows/verify-avito-delivery-counts.yml', 'scripts/avito_order_preview_readonly.py']
permissions:
  contents: read
jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/avito_order_preview_readonly.py
            /data/master_control.xlsx
            /data/avito_links.json
            /data/avito_autoload.json
      - name: Read delivery order totals
        env:
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
        run: python3 -B scripts/avito_order_preview_readonly.py --live --data-dir data > "$RUNNER_TEMP/order-summary.json"

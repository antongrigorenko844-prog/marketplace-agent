name: Inspect stock for three DSG listings
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt
      - env:
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
          WB_WAREHOUSE_ID: ${{ secrets.WB_WAREHOUSE_ID }}
          YANDEX_MARKET_API_KEY: ${{ secrets.YANDEX_MARKET_API_KEY }}
          YANDEX_MARKET_CAMPAIGN_ID: ${{ secrets.YANDEX_MARKET_CAMPAIGN_ID }}
        run: |
          python - <<'PY'
          import os
          from openpyxl import load_workbook
          import main
          import wb_client as wb
          import yandex_market_client as ym
          from config import config
          def match(s):
              return isinstance(s,str) and (s.lower().startswith(("remkomplekt-shtokov-orig","pylniki-shtokov-orig")) or s.lower() in {"0am325025","0am325066ae","0am325066ac","0am325443d","0am325219c","0am325433e","dq200dsg70am0cw","0cw0am325025","122390akaf","0сц","0am325025q"})
          for f in ("master_control","kits","yandex_market_offers"):
              w=load_workbook("data/"+f+".xlsx",read_only=True,data_only=True)
              for sheet in w:
                  rows=list(sheet.values)
                  print("SOURCE",f,sheet.title,rows[0],flush=True)
                  for row in rows:
                      if any(match(x) for x in row[:3]): print("ROW",f,row[:17],flush=True)
          print("STOCK SOURCE",[x for x in main._load_stock_items() if match(x["offer_id"])],flush=True)
          _, campaign=ym._creds()
          biz=ym.get_business_id()
          ids=["0cw0am325025","0am325025x"]
          for endpoint in (f"/v2/businesses/{biz}/offer-mappings",f"/v2/campaigns/{campaign}/offers",f"/v2/campaigns/{campaign}/offers/stocks"):
              try:
                  code,d=ym._request("POST",endpoint,json_body={"offerIds":ids})
                  result=d.get("result",{})
                  for row in result.get("offerMappings",[]):
                      o=row["offer"]
                      print("YM CONTENT",o["offerId"],o.get("pictures"),o.get("weightDimensions"),row.get("mapping"),row.get("showcaseUrls"),flush=True)
                  print("YM",code,result.get("offers"),result.get("warehouses"),flush=True)
              except Exception as e: print("YM ERROR",e,flush=True)
          for c in wb.list_cards():
              if c["vendorCode"]=="0cw0am325025": print("WB CONTENT",c["title"],c.get("description"),c.get("photos"),flush=True)
          PY

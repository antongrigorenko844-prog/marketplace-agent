name: Add reviewed existing product photos on WB
on: workflow_dispatch
permissions:
  contents: read
jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - env:
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
        run: python scripts/add_reviewed_wb_media.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wb-reviewed-media
          path: /tmp/wb-reviewed-media/

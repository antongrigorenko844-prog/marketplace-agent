name: LEOPARTS Ozon guarded model separation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ozon-model-group-repair-20261125.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: marketplace-agent
  cancel-in-progress: false
jobs:
  separate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
      OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q -r requirements.txt
      - run: python -m py_compile scripts/ozon_model_group_repair_20261125.py
      - run: python -u scripts/ozon_model_group_repair_20261125.py
      - if: always()
        run: |
          if [ -f data/ozon_model_group_repair_20261125.json ]; then bash .github/scripts/save_data.sh data/ozon_model_group_repair_20261125.json; fi

# Independent postmoderation verification; submitted journal prevents duplicate writes.

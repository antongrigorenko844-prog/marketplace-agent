name: LEOPARTS Direct verify 20 Nov cumulative changes (read-only)
on:
  push:
    branches: [main]
    paths:
      - .github/scripts/direct_final_verification_20261120.py
      - .github/workflows/direct-final-verification-20261120.yml
permissions:
  contents: write
concurrency:
  group: marketplace-agent
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify only one autotargeting category and exact negatives changed
        env:
          YANDEX_DIRECT_TOKEN: ${{ secrets.YANDEX_DIRECT_TOKEN }}
          YANDEX_DIRECT_LOGIN: ${{ secrets.YANDEX_DIRECT_LOGIN }}
        run: python .github/scripts/direct_final_verification_20261120.py
      - name: Save read-only proof
        if: always()
        run: bash .github/scripts/save_data.sh data/direct_optimization_20261120/final_state.json

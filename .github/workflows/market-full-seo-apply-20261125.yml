name: LEOPARTS Market reviewed exact SEO fixes
on:
  push:
    branches: [main]
    paths: ['.github/workflows/market-full-seo-apply-20261125.yml']
permissions:
  contents: write
concurrency:
  group: marketplace-agent
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      YANDEX_MARKET_API_KEY: ${{ secrets.YANDEX_MARKET_API_KEY }}
      YANDEX_MARKET_CAMPAIGN_ID: ${{ secrets.YANDEX_MARKET_CAMPAIGN_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q -r requirements.txt
      - run: python -m py_compile scripts/market_full_seo_20261125.py
      - name: Apply only reviewed existing-card attribute and singleton category changes
        run: python -u scripts/market_full_seo_20261125.py apply
      - if: always()
        run: |
          if [ -f data/market_full_seo_20261125.json ]; then bash .github/scripts/save_data.sh data/market_full_seo_20261125.json; fi

name: LEOPARTS Test Three Approved 6T30 Import Pipeline Syntax
on:
  push:
    branches: [main]
    paths: ['data/leoparts_6t30_photo_pipeline_compile_request.json']
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Compile only, no products or assets modified
        run: |
          python -m py_compile scripts/leoparts_6t30_photo_upload_and_publish.py
          echo COMPILE_OK

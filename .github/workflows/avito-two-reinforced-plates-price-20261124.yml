name: LEOPARTS Avito Two Old Reinforced Plates - Guarded
on:
  push:
    branches: [main]
    paths: ['data/avito_two_reinforced_plates_price_request_20261124.json']
permissions: {contents: write}
concurrency: {group: marketplace-agent, cancel-in-progress: false}
jobs:
  price-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install seller API dependencies
        run: pip install -q requests python-dotenv
      - name: Execute protected price-only alignment of old hydraulic plates
        env:
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
        run: |
          python -m py_compile scripts/avito_two_reinforced_plates_price_20261124.py
          python -u scripts/avito_two_reinforced_plates_price_20261124.py
      - name: Save seller price readback journal only
        if: always()
        run: |
          if [ -f data/avito_two_reinforced_plates_price_result_20261124.json ]; then
            bash .github/scripts/save_data.sh data/avito_two_reinforced_plates_price_result_20261124.json
          fi

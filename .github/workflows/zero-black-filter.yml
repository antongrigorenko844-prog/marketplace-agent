name: Zero requested black DQ500 filter housing
on: workflow_dispatch
permissions:
  contents: write
concurrency:
  group: marketplace-agent
  cancel-in-progress: false
jobs:
  zero:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt cryptography
      - env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
          WB_WAREHOUSE_ID: ${{ secrets.WB_WAREHOUSE_ID }}
          YANDEX_MARKET_API_KEY: ${{ secrets.YANDEX_MARKET_API_KEY }}
          YANDEX_MARKET_CAMPAIGN_ID: ${{ secrets.YANDEX_MARKET_CAMPAIGN_ID }}
        run: python scripts/private_black_filter_result.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: black-filter-encrypted-result
          path: reports/black-filter-private.enc

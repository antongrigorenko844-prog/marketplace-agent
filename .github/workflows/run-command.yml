# Переиспользуемый workflow (workflow_call): реальная работа — checkout,
# установка зависимостей, запуск одной команды main.py и сохранение data/
# обратно в репозиторий. Сам по себе руками не запускается (в Actions его
# не будет видно в списке "Run workflow") — его вызывают main.yml и
# tools.yml, у каждого свой (более короткий) выпадающий список команд,
# чтобы не дублировать в каждом файле одни и те же шаги.
#
# Если нужно поменять сами шаги выполнения (версию Python, команду запуска,
# логику сохранения data/) — меняются ТОЛЬКО здесь, а не в каждом файле.
name: run-command

on:
  workflow_call:
    inputs:
      command:
        required: true
        type: string
      article:
        required: false
        type: string
        default: ""
      seed_phrase:
        required: false
        type: string
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run command
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
          WB_WAREHOUSE_ID: ${{ secrets.WB_WAREHOUSE_ID }}
          OZON_WAREHOUSE_ID: ${{ secrets.OZON_WAREHOUSE_ID }}
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
          AVITO_SELLER_ADDRESS: ${{ secrets.AVITO_SELLER_ADDRESS }}
          WORDSTAT_API_KEY: ${{ secrets.WORDSTAT_API_KEY }}
          WORDSTAT_FOLDER_ID: ${{ secrets.WORDSTAT_FOLDER_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TILDA_COMMERCEML_URL: ${{ secrets.TILDA_COMMERCEML_URL }}
          TILDA_COMMERCEML_USER: ${{ secrets.TILDA_COMMERCEML_USER }}
          TILDA_COMMERCEML_PASSWORD: ${{ secrets.TILDA_COMMERCEML_PASSWORD }}
          YANDEX_MARKET_API_KEY: ${{ secrets.YANDEX_MARKET_API_KEY }}
          YANDEX_MARKET_CAMPAIGN_ID: ${{ secrets.YANDEX_MARKET_CAMPAIGN_ID }}
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_GROUP_TOKEN: ${{ secrets.VK_GROUP_TOKEN }}
          VK_PROXY_URL: ${{ secrets.VK_PROXY_URL }}
          VK_PROXY_KEY: ${{ secrets.VK_PROXY_KEY }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_TOKEN_KEY: ${{ secrets.IG_TOKEN_KEY }}
          SOCIAL_AUTOPUBLISH: ${{ secrets.SOCIAL_AUTOPUBLISH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python main.py --${{ inputs.command }} \
            --article "${{ inputs.article }}" \
            --seed-phrase "${{ inputs.seed_phrase }}"

      - name: Save data/ back to repo
        if: always()
        # правки людей, запушенные пока шла команда, не затираются (см. скрипт)
        run: bash .github/scripts/save_data.sh data/ photos/ social/

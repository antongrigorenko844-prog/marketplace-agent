name: LEOPARTS Avito Two Bare Rods — Guarded
on:
  push:
    branches: [main]
    paths: ['data/avito_two_bare_rods_price_20261124_request.json']
permissions: {contents: write}
concurrency: {group: marketplace-agent, cancel-in-progress: false}
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q requests python-dotenv
      - name: Verify unit prices and owner-confirmed two-rod composition
        env:
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
        run: |
          python -m py_compile scripts/avito_two_bare_rods_20261124.py
          python -u scripts/avito_two_bare_rods_20261124.py
      - name: Persist price-only execution record
        if: always()
        run: |
          if [ -f data/avito_two_bare_rods_price_20261124_result.json ]; then
            bash .github/scripts/save_data.sh data/avito_two_bare_rods_price_20261124_result.json
          fi

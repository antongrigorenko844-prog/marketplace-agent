name: LEOPARTS Ozon Gen2 solenoids rejected-type correction
on:
  push:
    branches: [main]
    paths: ['data/leoparts_ozon_gen2_moderation_fix_request_20261123.json']
permissions: {contents: write}
concurrency: {group: marketplace-agent, cancel-in-progress: false}
jobs:
  same-sku-approved-title-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q -r requirements.txt
      - run: python -m py_compile scripts/leoparts_ozon_gen2_moderation_fix_20261123.py
      - name: Resubmit only declined Gen2 with approved WB title, original image and unchanged price
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
        run: python -u scripts/leoparts_ozon_gen2_moderation_fix_20261123.py
      - name: Save exact Ozon moderation response
        if: always()
        run: |
          if [ -f data/leoparts_ozon_gen2_moderation_fix_20261123_result.json ]; then
            bash .github/scripts/save_data.sh data/leoparts_ozon_gen2_moderation_fix_20261123_result.json
          fi

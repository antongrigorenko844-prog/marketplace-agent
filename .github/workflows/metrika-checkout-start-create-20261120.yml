name: LEOPARTS Metrica add checkout START goal (not purchase)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/metrika-checkout-start-create-20261120.yml
      - tests/test_metrika_checkout_goal_safe.py
permissions:
  contents: write
concurrency:
  group: marketplace-agent
  cancel-in-progress: false
jobs:
  one-goal:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile code and verify goal scope offline
        run: |
          python -m py_compile .github/scripts/metrika_checkout_start_create_20261120.py
          python -m unittest discover -s tests -p test_metrika_checkout_goal_safe.py -v
      - name: Create only separate checkout-start goal with WRITE token
        env:
          YANDEX_METRIKA_WRITE_TOKEN: ${{ secrets.YANDEX_METRIKA_WRITE_TOKEN }}
        run: python .github/scripts/metrika_checkout_start_create_20261120.py
      - name: Persist attempted write and readback verification
        if: always()
        run: bash .github/scripts/save_data.sh data/direct_optimization_20261120/metrika_checkout_start_create.json

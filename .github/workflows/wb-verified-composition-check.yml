name: Check exact WB composition sources
on:
  push:
    branches: ['audit/wb-composition-verified-20261120']
    paths: ['.github/workflows/wb-verified-composition-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip -q install -r requirements.txt
      - name: Check live product content for exact seller offer
        env:
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
        run: python scripts/wb_verified_composition_check.py

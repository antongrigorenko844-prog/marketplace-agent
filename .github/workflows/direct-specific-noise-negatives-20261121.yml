name: LEOPARTS safe three exact noise negatives (one-shot)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/direct-specific-noise-negatives-20261121.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: marketplace-agent
  cancel-in-progress: false
jobs:
  update-guarded:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Append only three justified exact negative phrases and verify live readback
        env:
          YANDEX_DIRECT_TOKEN: ${{ secrets.YANDEX_DIRECT_TOKEN }}
          YANDEX_DIRECT_LOGIN: ${{ secrets.YANDEX_DIRECT_LOGIN }}
        run: python .github/scripts/direct_specific_noise_negatives_20261121.py
      - name: Persist guarded campaign update journal
        if: always()
        run: bash .github/scripts/save_data.sh data/direct_optimization_20261120/specific_noise_negatives_20261121.json

name: direct-apply-approved-negatives
on:
  push:
    branches: [main]
    paths: ['.github/agent-requests/direct-apply-approved-negatives.txt']
permissions:
  contents: write
concurrency:
  group: marketplace-agent
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply and verify owner-approved negatives
        env:
          YANDEX_DIRECT_TOKEN: ${{ secrets.YANDEX_DIRECT_TOKEN }}
          YANDEX_DIRECT_LOGIN: ${{ secrets.YANDEX_DIRECT_LOGIN }}
        run: python .github/scripts/direct_apply_approved_negatives.py
      - name: Save verified result
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/direct_negatives_apply_result.txt
          git diff --cached --quiet || (git commit -m "Record verified Direct negative keywords" && git pull --rebase && git push)

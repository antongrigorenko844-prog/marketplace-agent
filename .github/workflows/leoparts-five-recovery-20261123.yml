name: LEOPARTS Five SKU Recovery WB And Market Nov23
on:
  push:
    branches: [main]
    paths:
      - 'data/leoparts_five_recovery_20261123_request.json'
permissions:
  contents: write
concurrency:
  group: marketplace-agent
  cancel-in-progress: false
jobs:
  exact-five:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requirements
        run: pip install -q -r requirements.txt
      - name: Compile and execute five-SKU limited recovery
        env:
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
          WB_WAREHOUSE_ID: ${{ secrets.WB_WAREHOUSE_ID }}
          YANDEX_MARKET_API_KEY: ${{ secrets.YANDEX_MARKET_API_KEY }}
          YANDEX_MARKET_CAMPAIGN_ID: ${{ secrets.YANDEX_MARKET_CAMPAIGN_ID }}
        run: |
          python -m py_compile scripts/leoparts_five_recovery_20261123.py
          python -u scripts/leoparts_five_recovery_20261123.py
      - name: Preserve per-channel statuses, even on partial failure
        if: always()
        run: |
          if [ -f data/leoparts_five_recovery_20261123_result.json ]; then
            bash .github/scripts/save_data.sh data/leoparts_five_recovery_20261123_result.json
          fi

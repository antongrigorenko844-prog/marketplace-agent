name: LEOPARTS Owner Verified Old Rod Kits — Guarded
on:
  push:
    branches: [main]
    paths: ['data/avito_verified_rods_price_20261124_request.json']
permissions: {contents: write}
concurrency: {group: marketplace-agent, cancel-in-progress: false}
jobs:
  inspect-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install API read and price-only requirements
        run: pip install -q requests python-dotenv
      - name: Price-only owner-approved rod kit workflow
        env:
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
        run: |
          python -m py_compile scripts/avito_owner_verified_rods_price_20261124.py
          python -u scripts/avito_owner_verified_rods_price_20261124.py
      - name: Save verification journal without altering prices/feeds in Git
        if: always()
        run: |
          if [ -f data/avito_verified_rods_price_20261124_result.json ]; then
            bash .github/scripts/save_data.sh data/avito_verified_rods_price_20261124_result.json
          fi

name: LEOPARTS Avito Legacy Link Preflight — READ ONLY
on:
  push:
    branches: [main]
    paths: ['data/avito_legacy_link_preflight_request_20261124.json']
permissions: {contents: write}
concurrency: {group: marketplace-agent, cancel-in-progress: false}
jobs:
  legacy-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Dependencies for read-only seller analytics
        run: pip install -q requests python-dotenv
      - name: Inspect all 36 live listings, primary duplicates and statistics
        env:
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
        run: |
          python -m py_compile scripts/avito_legacy_selection_preflight_20261124.py
          python -u scripts/avito_legacy_selection_preflight_20261124.py
      - name: Save only read-only diagnostics, never Avito price/stock/feed
        if: always()
        run: |
          if [ -f data/avito_legacy_selection_preflight_20261124.json ]; then
            bash .github/scripts/save_data.sh data/avito_legacy_selection_preflight_20261124.json
          fi

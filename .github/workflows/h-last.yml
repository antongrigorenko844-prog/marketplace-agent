name: Add pressure regulator photo to Bosch mechatronic
on: workflow_dispatch
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt
      - env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
        run: |
          python - <<'PY'
          import time
          import ozon_client as oz
          source="0AM325025B"
          sku="0am325025x"
          def items(ids):
              return {p["offer_id"]:p for p in oz.get_product_info_list(ids)}
          data=items([source,sku])
          photo,=data[source]["primary_image"]
          target=data[sku]
          primary,=target["primary_image"]
          assert target["sku"]==3260518430 and photo!=primary
          before=target.get("images") or []
          desired=[photo]+[url for url in before if url!=photo]
          print("BEFORE",primary,before,"SOURCE",photo,flush=True)
          if desired!=before:
              payload={"offer_id":sku,"primary_image":primary,"images":desired}
              for key in ("images360","color_image"):
                  if target.get(key): payload[key]=target[key]
              response=oz._post("/v2/product/pictures/import",{"items":[payload]})
              print("IMPORT",response,flush=True)
              assert response.get("task_id")
          for _ in range(10):
              time.sleep(5)
              current=items([sku])[sku]
              print("VERIFY",current["primary_image"],current.get("images"),flush=True)
              if current["primary_image"]==[primary] and current.get("images")==desired: break
          else: raise RuntimeError("Gallery order not confirmed")
          PY

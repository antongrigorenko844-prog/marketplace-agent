name: Add regulator image across channels and inspect WB
on: workflow_dispatch
permissions:
  contents: write
concurrency:
  group: marketplace-agent
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt
      - env:
          GH_TOKEN: ${{ github.token }}
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
          YANDEX_MARKET_API_KEY: ${{ secrets.YANDEX_MARKET_API_KEY }}
          YANDEX_MARKET_CAMPAIGN_ID: ${{ secrets.YANDEX_MARKET_CAMPAIGN_ID }}
          TILDA_COMMERCEML_URL: ${{ secrets.TILDA_COMMERCEML_URL }}
          TILDA_COMMERCEML_USER: ${{ secrets.TILDA_COMMERCEML_USER }}
          TILDA_COMMERCEML_PASSWORD: ${{ secrets.TILDA_COMMERCEML_PASSWORD }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          import requests
          from openpyxl import load_workbook
          import avito_feed as av
          import wb_client as wb
          import yandex_market_client as ym
          import tilda_commerceml as tc

          sku="0am325025x"
          photo="https://ir.ozone.ru/s3/multimedia-1-k/14848101956.jpg"
          def ordered(urls):
              assert urls
              return [urls[0],photo,*[u for u in urls[1:] if u!=photo]]
          c,=[c for c in wb.list_cards() if c["vendorCode"]==sku]
          print("WB GALLERY",c["photos"],flush=True)
          biz=ym.get_business_id()
          _,d=ym._request("POST",f"/v2/businesses/{biz}/offer-mappings",json_body={"offerIds":[sku]})
          print("YM GALLERY",d["result"]["offerMappings"][0]["offer"]["pictures"],flush=True)
          subprocess.run(["gh","release","download","product-photos","-p","avito_feed.xlsx","-D","/tmp"],check=True)
          path="/tmp/avito_feed.xlsx"
          book=load_workbook(path)
          row,=[r for r in book[av.SHEET_ADS].iter_rows(min_row=av.FIRST_DATA_ROW) if str(r[av.COL_ID-1].value).removesuffix(getattr(av,"AVITO_LINK_SUFFIX",""))==sku]
          cell=row[av.COL_IMAGE_URLS-1]
          urls=[u.strip() for u in cell.value.replace("|","\n").splitlines() if u.strip()]
          value="\n".join(ordered(urls))
          if value!=cell.value:
              cell.value=value
              book.save(path)
              subprocess.run(["gh","release","upload","product-photos",path,"--clobber"],check=True)
          print("AVITO GALLERY",value.splitlines(),flush=True)
          PY

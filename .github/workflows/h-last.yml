name: Add photo only to Tilda gallery
on: workflow_dispatch
permissions:
  contents: write
concurrency:
  group: marketplace-agent
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt
      - env:
          GH_TOKEN: ${{ github.token }}
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
          YANDEX_MARKET_API_KEY: ${{ secrets.YANDEX_MARKET_API_KEY }}
          YANDEX_MARKET_CAMPAIGN_ID: ${{ secrets.YANDEX_MARKET_CAMPAIGN_ID }}
          TILDA_COMMERCEML_URL: ${{ secrets.TILDA_COMMERCEML_URL }}
          TILDA_COMMERCEML_USER: ${{ secrets.TILDA_COMMERCEML_USER }}
          TILDA_COMMERCEML_PASSWORD: ${{ secrets.TILDA_COMMERCEML_PASSWORD }}
        run: |
          python - <<'PY'
          import json,os,time
          import xml.etree.ElementTree as ET
          import requests
          import tilda_commerceml as tc
          sku="0am325025x"
          def product():
              r=requests.get("https://store.tildaapi.com/api/getproductslist/",params={"storepartuid":"419144347374","recid":"1928468643","size":100,"c":int(time.time()*1000)},timeout=15)
              r.raise_for_status()
              p,=[p for p in r.json()["products"] if p["sku"]==sku]
              return p
          before=product()
          pics=json.loads(before["gallery"])
          assert before["externalid"]==sku and len(pics)==1
          urls=[pics[0]["img"],"https://ir.ozone.ru/s3/multimedia-1-k/14848101956.jpg"]
          files=[]
          for i,u in enumerate(urls):
              r=requests.get(u,timeout=15)
              r.raise_for_status()
              assert r.headers["Content-Type"].startswith("image/")
              files.append((f"import_files/dq200x-gallery-{i}."+("png" if "png" in r.headers["Content-Type"] else "jpg"),r.content))
          root=ET.fromstring(tc.build_import_xml([]))
          catalog=root.find("Каталог")
          catalog.set("СодержитТолькоИзменения","true")
          item=ET.SubElement(catalog.find("Товары"),"Товар")
          ET.SubElement(item,"Ид").text=sku
          for filename,_ in files: ET.SubElement(item,"Картинка").text=filename
          assert [c.tag for c in item]==["Ид","Картинка","Картинка"]
          offers=tc.build_offers_xml([]).replace('СодержитТолькоИзменения="false"','СодержитТолькоИзменения="true"')
          print("TILDA IMPORT",tc.push(os.environ["TILDA_COMMERCEML_URL"],os.environ["TILDA_COMMERCEML_USER"],os.environ["TILDA_COMMERCEML_PASSWORD"],ET.tostring(root,encoding="unicode"),offers,image_files=files),flush=True)
          for _ in range(6):
              after=product()
              assert all(after.get(k)==before.get(k) for k in ("price","priceold","quantity","title","descr","text"))
              print("TILDA VERIFY",after["gallery"],flush=True)
              if len(json.loads(after["gallery"]))==2: break
              time.sleep(5)
          else: raise RuntimeError("Second photo not confirmed")
          PY

name: Verify four approved exact gearbox repair exclusions
on:
  push:
    branches: ['ops/dq200-four-exact-gearbox-repair-20261121']
    paths: ['.github/workflows/approved-dq200-four-exact-gearbox-repair.yml']
permissions:
  contents: read
concurrency:
  group: marketplace-agent
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply the four exact phrases and verify live settings
        env:
          YANDEX_DIRECT_TOKEN: ${{ secrets.YANDEX_DIRECT_TOKEN }}
          YANDEX_DIRECT_LOGIN: ${{ secrets.YANDEX_DIRECT_LOGIN }}
        run: |
          PYTHONPATH=.github/scripts python - <<'PY'
          import dq200_approved_nine_20261121 as reconcile

          reconcile.TERMS = (
              '"ремонт коробки передач dq200"',
              '"ремонт роботизированной коробки передач"',
              '"ремонт dsg 7"',
              '"ремонт дсг 7 dq200"',
          )
          reconcile.main()
          PY

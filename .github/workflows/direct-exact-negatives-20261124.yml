name: LEOPARTS Nov24 exact negative queries
on:
  push:
    branches: [main]
    paths: ['.github/workflows/direct-exact-negatives-20261124.yml']
permissions:
  contents: write
concurrency:
  group: marketplace-agent
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Append exact observed queries and verify
        env:
          YANDEX_DIRECT_TOKEN: ${{ secrets.YANDEX_DIRECT_TOKEN }}
          YANDEX_DIRECT_LOGIN: ${{ secrets.YANDEX_DIRECT_LOGIN }}
        run: |
          python -m py_compile .github/scripts/direct_exact_negatives_20261124.py
          python .github/scripts/direct_exact_negatives_20261124.py
      - name: Persist evidence
        if: always()
        run: bash .github/scripts/save_data.sh data/direct_recovery_20261124/exact_negatives.json

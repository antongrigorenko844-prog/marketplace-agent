name: Private Market content check
on:
  push:
    branches: ['audit/marketing-metrics-private-20261120']
    paths:
      - 'scripts/live_ym_private.py'
      - '.github/workflows/marketing-private-market.yml'
permissions:
  contents: read
jobs:
  market:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q -r requirements.txt cryptography
      - name: Read and encrypt catalog and order aggregates
        env:
          YANDEX_MARKET_API_KEY: ${{ secrets.YANDEX_MARKET_API_KEY }}
          YANDEX_MARKET_CAMPAIGN_ID: ${{ secrets.YANDEX_MARKET_CAMPAIGN_ID }}
        run: python scripts/live_ym_private.py --public-key scripts/marketing_audit_verify_public.pem --output "${RUNNER_TEMP}/private-market.enc"
      - uses: actions/upload-artifact@v4
        with:
          name: market-content-encrypted
          path: ${{ runner.temp }}/private-market.enc
          retention-days: 1
          if-no-files-found: error

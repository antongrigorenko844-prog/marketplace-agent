name: LEOPARTS verify access monitor regression tests
on:
  push:
    branches: [main]
    paths: ['.github/workflows/site-mobile-access-tests-20261126.yml', 'tests/test_direct_page_access.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q -r requirements.txt
      - run: python -m unittest discover -s tests -p test_direct_page_access.py -v

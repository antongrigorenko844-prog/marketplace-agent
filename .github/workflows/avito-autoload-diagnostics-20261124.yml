name: LEOPARTS Avito Autoload Diagnostics - READ ONLY
on:
  push:
    branches: [main]
    paths: ['data/avito_autoload_diagnostics_request_20261124.json']
permissions: {contents: write}
concurrency:
  group: marketplace-agent
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q requests python-dotenv
      - name: Query Avito autoload without any mutations
        env:
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
        run: |
          python -m py_compile scripts/avito_autoload_diagnostics_20261124.py
          python -u scripts/avito_autoload_diagnostics_20261124.py
      - name: Persist autoload diagnostic only
        if: always()
        run: |
          if [ -f data/avito_autoload_diagnostics_20261124.json ]; then
            bash .github/scripts/save_data.sh data/avito_autoload_diagnostics_20261124.json
          fi

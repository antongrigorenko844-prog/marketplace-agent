name: LEOPARTS Add Three Verified 6T30 Master Rows Only
on:
  push:
    branches: [main]
    paths: ['data/leoparts_6t30_master_append_request.json']
permissions: {contents: write}
concurrency: {group: marketplace-agent, cancel-in-progress: false}
jobs:
  append:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q openpyxl
      - run: |
          python -m py_compile scripts/leoparts_6t30_master_append_20261123.py
          python -u scripts/leoparts_6t30_master_append_20261123.py
      - if: always()
        run: |
          test ! -f data/leoparts_6t30_master_append_20261123_result.json || bash .github/scripts/save_data.sh data/master_control.xlsx data/leoparts_6t30_master_append_20261123_result.json

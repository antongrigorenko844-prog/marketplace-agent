name: LEOPARTS restore 0am325025 Ozon price to 13850 guarded
on:
  push:
    branches: [main]
    paths:
      - 'scripts/ozon_restore_0am325025_20261123.py'
      - '.github/workflows/ozon-restore-0am325025-20261123.yml'
permissions: {contents: write}
concurrency:
  group: marketplace-agent
  cancel-in-progress: false
jobs:
  restore-exact:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - name: Restore only 0am325025 Ozon price 12950 to 13850 and ledger
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m py_compile scripts/ozon_restore_0am325025_20261123.py
          python -m scripts.ozon_restore_0am325025_20261123
      - name: Preserve operation journal when available
        if: always()
        run: |
          if [ -f data/ozon_restore_0am325025_20261123.json ]; then
            bash .github/scripts/save_data.sh data/ozon_restore_0am325025_20261123.json
          fi

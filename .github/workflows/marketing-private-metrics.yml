name: Private seller metrics check
on:
  push:
    branches:
      - audit/marketing-metrics-private-20261120
    paths:
      - 'scripts/live_metrics.py'
      - 'scripts/marketing_audit_verify_public.pem'
      - '.github/workflows/marketing-private-metrics.yml'
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q -r requirements.txt cryptography
      - name: Read and encrypt seller metrics
        env:
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
          YANDEX_MARKET_API_KEY: ${{ secrets.YANDEX_MARKET_API_KEY }}
          YANDEX_MARKET_CAMPAIGN_ID: ${{ secrets.YANDEX_MARKET_CAMPAIGN_ID }}
        run: python scripts/live_metrics.py --public-key scripts/marketing_audit_verify_public.pem --output "${RUNNER_TEMP}/private-metrics.enc"
      - uses: actions/upload-artifact@v4
        with:
          name: seller-metrics-encrypted
          path: ${{ runner.temp }}/private-metrics.enc
          if-no-files-found: error
          retention-days: 1

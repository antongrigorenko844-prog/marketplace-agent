name: LEOPARTS generic parts exclusions other two groups Nov 22
on:
  push:
    branches: [main]
    paths: ['.github/workflows/direct-two-groups-parts-negatives-20261122.yml']
permissions:
  contents: write
concurrency:
  group: marketplace-agent
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        run: python -m py_compile .github/scripts/direct_two_groups_parts_negatives_20261122.py
      - name: Guarded group-level generic parts exclusions for DQ200 without board and PCBs
        env:
          YANDEX_DIRECT_TOKEN: ${{ secrets.YANDEX_DIRECT_TOKEN }}
          YANDEX_DIRECT_LOGIN: ${{ secrets.YANDEX_DIRECT_LOGIN }}
        run: python .github/scripts/direct_two_groups_parts_negatives_20261122.py
      - name: Persist group-level before and after verification
        if: always()
        run: bash .github/scripts/save_data.sh data/direct_recovery_20261122/other_two_generic_parts_exclusion.json

name: LEOPARTS Avito Full Price Audit — READ ONLY
on:
  push:
    branches: [main]
    paths: ['data/avito_price_audit_request_20261124.json']
permissions: {contents: write}
concurrency: {group: marketplace-agent, cancel-in-progress: false}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Minimal API read dependencies
        run: pip install -q requests python-dotenv
      - name: Compile and run owner-requested Avito price audit, no seller writes
        env:
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
        run: |
          python -m py_compile scripts/avito_price_audit_20261124.py
          python -u scripts/avito_price_audit_20261124.py
      - name: Inspect old manual ads and user-confirmed duplicate contents (read-only)
        env:
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
        run: python -u scripts/avito_manual_duplicates_20261124.py
      - name: Save audit report only
        if: always()
        run: |
          if [ -f data/avito_price_audit_20261124.json ]; then
            bash .github/scripts/save_data.sh data/avito_price_audit_20261124.json data/avito_manual_duplicates_review_20261124.json
          fi

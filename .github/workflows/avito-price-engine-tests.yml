name: LEOPARTS Avito bulk-price engine — SAFE TESTS
on:
  push:
    branches: [main]
    paths:
      - 'scripts/avito_bulk_price_engine.py'
      - 'tests/test_avito_bulk_price_engine.py'
      - '.github/workflows/avito-price-engine-tests.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  no-seller-writes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Compile pure batch engine
        run: python -m py_compile scripts/avito_bulk_price_engine.py tests/test_avito_bulk_price_engine.py
      - name: Test safety with in-memory fake seller API (never reads credentials)
        run: python -m unittest discover -s tests -p 'test_avito_bulk_price_engine.py' -v

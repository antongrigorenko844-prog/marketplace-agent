name: LEOPARTS Avito bulk-price pipeline v2 — SAFE TESTS
on:
  push:
    branches: [main]
    paths:
      - 'scripts/avito_bulk_price_engine.py'
      - 'scripts/avito_price_pipeline_v2.py'
      - 'tests/test_avito_bulk_price_engine.py'
      - 'tests/test_avito_price_pipeline_v2.py'
      - '.github/workflows/avito-price-engine-tests.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  no-seller-writes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install test-only reader requirements
        run: pip install -q openpyxl requests python-dotenv
      - name: Compile offline price pipeline
        run: |
          python -m py_compile scripts/avito_bulk_price_engine.py scripts/avito_price_pipeline_v2.py
          python -m py_compile tests/test_avito_bulk_price_engine.py tests/test_avito_price_pipeline_v2.py
      - name: Test with fake seller and temporary workbooks, no credentials
        run: python -m unittest discover -s tests -p 'test_avito_*price*.py' -v

name: LEOPARTS Direct post-cap traffic review (read-only)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/direct-live-review-20261120.yml
      - .github/scripts/direct_live_review_20261120.py
permissions:
  contents: write
concurrency:
  group: marketplace-agent
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read Direct campaign only (no mutation)
        env:
          YANDEX_DIRECT_TOKEN: ${{ secrets.YANDEX_DIRECT_TOKEN }}
          YANDEX_DIRECT_LOGIN: ${{ secrets.YANDEX_DIRECT_LOGIN }}
        run: python .github/scripts/direct_live_review_20261120.py
      - name: Save read-only search and targeting report
        if: always()
        run: bash .github/scripts/save_data.sh data/direct_optimization_20261120/live_traffic_review.json

name: LEOPARTS Ozon historical traffic investigation read-only Nov 28
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ozon-history-readonly-20261128.yml']
permissions:
  contents: write
concurrency:
  group: leoparts-ozon-audit-readonly
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - name: Read historical analytics only
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
        run: python -u -m scripts.ozon_history_readonly_20261128
      - name: Save aggregated evidence without buyer details
        if: always()
        run: bash .github/scripts/save_data.sh data/ozon_history_20261128/api_daily_evidence.json

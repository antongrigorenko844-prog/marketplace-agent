name: LEOPARTS new Avito DQ200 exchange description only
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/avito-dq200-exchange-text-20261126.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: marketplace-agent
  cancel-in-progress: false
jobs:
  exchange-text:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q -r requirements.txt
      - run: python -m py_compile scripts/avito_dq200_exchange_text_20261126.py
      - name: Update one exact description cell using resolved workbook relationship and verify
        env:
          GH_TOKEN: ${{ github.token }}
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
        run: python -u scripts/avito_dq200_exchange_text_20261126.py

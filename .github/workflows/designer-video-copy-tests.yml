name: LEOPARTS designer video copy delivery checks
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/designer-video-copy-tests.yml'
      - 'designer_video.py'
      - 'designer_video_backfill.py'
      - 'video_copy.py'
      - 'tests/test_designer_video.py'
      - 'tests/test_video_copy.py'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Verify video publication copy and Telegram delivery safety
        run: |
          python -m unittest discover -s tests -p test_designer_video.py -v
          python -m unittest discover -s tests -p test_video_copy.py -v

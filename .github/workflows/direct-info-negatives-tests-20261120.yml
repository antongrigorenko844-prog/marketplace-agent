name: LEOPARTS verify diagnostic exact negatives offline
on:
  push:
    branches: [main]
    paths:
      - .github/scripts/direct_info_service_negatives_20261120.py
      - tests/test_direct_info_negatives_safe.py
      - .github/workflows/direct-info-negatives-tests-20261120.yml
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run guarded negative exclusion tests without credentials
        run: python -m unittest discover -s tests -p test_direct_info_negatives_safe.py -v

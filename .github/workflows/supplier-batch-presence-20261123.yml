name: LEOPARTS verify eight supplier list products across five channels read only
on:
  push:
    branches: [main]
    paths:
      - 'data/supplier_batch_presence_20261123_request.json'
permissions:
  contents: write
concurrency:
  group: marketplace-agent
  cancel-in-progress: false
jobs:
  read_only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install existing dependencies
        run: pip install -q -r requirements.txt
      - name: Cross-check named supplier products against master, Ozon, WB, Market, Avito and site
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
          YANDEX_MARKET_API_KEY: ${{ secrets.YANDEX_MARKET_API_KEY }}
          YANDEX_MARKET_CAMPAIGN_ID: ${{ secrets.YANDEX_MARKET_CAMPAIGN_ID }}
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
        run: |
          python -m py_compile scripts/supplier_batch_presence_20261123.py
          python -u scripts/supplier_batch_presence_20261123.py
      - name: Save read-only presence report
        if: always()
        run: |
          if [ -f data/supplier_batch_presence_20261123_result.json ]; then
            bash .github/scripts/save_data.sh data/supplier_batch_presence_20261123_result.json
          fi

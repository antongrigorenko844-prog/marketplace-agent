name: LEOPARTS private read-only crisis followup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/leoparts-crisis-followup-20261124.yml']
permissions:
  contents: write
jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        section: [inventory, site]
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q -r requirements.txt cryptography playwright
      - if: matrix.section == 'site'
        run: python -m playwright install chromium
      - name: Collect encrypted aggregate data only
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
          WB_WAREHOUSE_ID: ${{ secrets.WB_WAREHOUSE_ID }}
          YANDEX_MARKET_API_KEY: ${{ secrets.YANDEX_MARKET_API_KEY }}
          YANDEX_MARKET_CAMPAIGN_ID: ${{ secrets.YANDEX_MARKET_CAMPAIGN_ID }}
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
          YANDEX_METRIKA_TOKEN: ${{ secrets.YANDEX_METRIKA_TOKEN }}
        run: |
          python -m py_compile scripts/leoparts_crisis_followup_20261124.py
          python scripts/leoparts_crisis_followup_20261124.py "${{ matrix.section }}" >/dev/null 2>&1
          test -s "data/crisis_followup_20261124/${{ matrix.section }}.enc"
      - name: Save encrypted report only
        run: bash .github/scripts/save_data.sh "data/crisis_followup_20261124/${{ matrix.section }}.enc"

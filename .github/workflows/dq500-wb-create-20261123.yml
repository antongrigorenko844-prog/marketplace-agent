name: LEOPARTS create missing smooth Dq500 WB card only
on:
  push:
    branches: [main]
    paths:
      - 'data/dq500_wb_create_20261123_request.json'
permissions:
  contents: write
concurrency:
  group: marketplace-agent
  cancel-in-progress: false
jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install project dependencies
        run: pip install -q -r requirements.txt
      - name: Verify script syntax
        run: python -m py_compile scripts/dq500_wb_create_20261123.py
      - name: Create exact missing smooth Dq500 WB product and validate
        env:
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
          WB_WAREHOUSE_ID: ${{ secrets.WB_WAREHOUSE_ID }}
        run: python -u scripts/dq500_wb_create_20261123.py
      - name: Save creation readback and any exact master WB price adjustment
        if: always()
        run: |
          if [ -f data/dq500_wb_create_20261123_result.json ]; then
            bash .github/scripts/save_data.sh data/dq500_wb_create_20261123_result.json data/master_control.xlsx
          fi

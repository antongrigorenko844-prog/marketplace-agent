name: LEOPARTS remove only Gen1 second photo
on:
  push:
    branches: [main]
    paths: ['.github/workflows/6t30-gen1-remove-second-20261125.yml']
permissions:
  contents: write
concurrency:
  group: marketplace-agent
  cancel-in-progress: false
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q -r requirements.txt pillow
      - name: Remove only existing Gen1 second photo and verify main
        env:
          GH_TOKEN: ${{ github.token }}
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
          YANDEX_MARKET_API_KEY: ${{ secrets.YANDEX_MARKET_API_KEY }}
          YANDEX_MARKET_CAMPAIGN_ID: ${{ secrets.YANDEX_MARKET_CAMPAIGN_ID }}
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
        run: |
          python -m py_compile scripts/6t30_gen1_remove_second_20261125.py
          python -u scripts/6t30_gen1_remove_second_20261125.py
      - name: Save exact report if needed
        if: always()
        run: |
          test ! -f data/6t30_gen1_remove_second_result_20261125.json || bash .github/scripts/save_data.sh data/6t30_gen1_remove_second_result_20261125.json

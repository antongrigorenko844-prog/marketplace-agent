name: Inspect EA888 Ozon product types
on: workflow_dispatch
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
        run: |
          python - <<'PY'
          import ozon_client as oz
          for a in oz.get_category_attributes(74606916,970840917):
              if a.get("is_required") or a["id"] in (4384, 7324, 11031, 22232, 9048):
                  print(a["id"], a["name"], a.get("dictionary_id"), a.get("is_required"))
          PY

name: direct-metrika-goals-probe
on:
  push:
    branches: [main]
    paths: ['.github/agent-requests/direct-metrika-goals-probe.txt']
permissions:
  contents: write
concurrency:
  group: marketplace-agent
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read two goal definitions with the existing token
        env:
          YANDEX_DIRECT_TOKEN: ${{ secrets.YANDEX_DIRECT_TOKEN }}
        run: python .github/scripts/direct_metrika_goals_probe.py
      - name: Read active feed filter schema
        env:
          YANDEX_DIRECT_TOKEN: ${{ secrets.YANDEX_DIRECT_TOKEN }}
          YANDEX_DIRECT_LOGIN: ${{ secrets.YANDEX_DIRECT_LOGIN }}
        run: python .github/scripts/direct_feed_schema_probe.py
      - name: Save bounded probe result
        if: always()
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add data/direct_metrika_goals_probe_20261119.json data/direct_feed_schema_20261119.json
          git diff --cached --quiet || (git commit -m "Save read-only Metrica goal definitions probe" && git fetch origin main && git rebase origin/main && git push)

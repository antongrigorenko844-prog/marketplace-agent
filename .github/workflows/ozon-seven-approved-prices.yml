name: LEOPARTS 7 owner-approved Ozon price rescue — safe guarded apply
on:
  push:
    branches: [main]
    paths:
      - 'scripts/ozon_seven_prices_apply_20261123.py'
      - '.github/workflows/ozon-seven-approved-prices.yml'
permissions: {contents: write}
concurrency:
  group: marketplace-agent
  cancel-in-progress: false
jobs:
  approved-seven:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - name: Stage 7 catalog prices and five owner-approved purchase costs, then update Ozon once
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m py_compile scripts/ozon_seven_prices_apply_20261123.py
          python -m scripts.ozon_seven_prices_apply_20261123
      - name: Persist audit journal without blind Ozon replay
        if: always()
        run: |
          if [ -f data/ozon_approved_seven_prices_20261123.json ]; then
            bash .github/scripts/save_data.sh data/ozon_approved_seven_prices_20261123.json
          fi

name: LEOPARTS FIX Ozon EA888 intake screw wrong product type
on:
  push:
    branches: [main]
    paths: ['data/repair_vint_ea888_ozon_apply_20261123_request.json']
permissions:
  contents: write
concurrency:
  group: marketplace-agent
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q -r requirements.txt
      - name: Correct only EA888 screw Ozon category and type; preserve price and stock
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
        run: |
          python -m py_compile scripts/repair_vint_ea888_ozon_apply_20261123.py
          python -u scripts/repair_vint_ea888_ozon_apply_20261123.py
      - name: Save exact one-SKU correction and independent moderation readback
        if: always()
        run: |
          if [ -f data/repair_vint_ea888_ozon_apply_20261123_result.json ]; then
            bash .github/scripts/save_data.sh \
              data/repair_vint_ea888_ozon_apply_20261123_result.json \
              data/master_control.xlsx \
              data/ozon_catalog.xlsx
          fi

name: DQ200 approved site and Avito prices 20261120
on:
  push:
    paths:
      - 'data/dq200_price_change_request_20261120.txt'
permissions:
  contents: write
concurrency:
  group: marketplace-agent
  cancel-in-progress: false
jobs:
  approved-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing dependencies
        run: pip install -r requirements.txt
      - name: Run requested price operation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
          TILDA_COMMERCEML_URL: ${{ secrets.TILDA_COMMERCEML_URL }}
          TILDA_COMMERCEML_USER: ${{ secrets.TILDA_COMMERCEML_USER }}
          TILDA_COMMERCEML_PASSWORD: ${{ secrets.TILDA_COMMERCEML_PASSWORD }}
        run: python scripts/apply_dq200_prices_20261120.py
      - name: Save operation report
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for file in data/dq200_price_preflight_20261120.json data/dq200_price_apply_20261120.json data/dq200_price_api_schema_20261120.json data/dq200_price_verify_20261120.json; do
            if [ -f "$file" ]; then git add -- "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Record owner-approved DQ200 price operation'
            git push origin HEAD:main
          fi

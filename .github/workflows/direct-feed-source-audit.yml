name: direct-feed-source-audit
on:
  push:
    branches: [main]
    paths: ['.github/agent-requests/direct-feed-source-audit.txt']
permissions:
  contents: write
concurrency:
  group: marketplace-agent
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read live feed source
        env:
          YANDEX_DIRECT_TOKEN: ${{ secrets.YANDEX_DIRECT_TOKEN }}
          YANDEX_DIRECT_LOGIN: ${{ secrets.YANDEX_DIRECT_LOGIN }}
        run: python .github/scripts/direct_feed_source_audit.py
      - name: Save
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add data/direct_feed_4061297_audit.json
          git diff --cached --quiet || (git commit -m "Audit active Direct feed source" && git fetch origin main && git rebase origin/main && git push)

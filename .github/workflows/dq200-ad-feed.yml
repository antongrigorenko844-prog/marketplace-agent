name: DQ200 verified automatic advertising feed
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"
  push:
    branches: [main]
    paths:
      - scripts/sync_dq200_live_feed.py
      - tests/test_sync_dq200_live_feed.py
      - .github/workflows/dq200-ad-feed.yml
      - data/site_prices.json
      - data/site_price_only_overrides.json
      - data/avito_site_price_overrides.xlsx
permissions:
  contents: write
concurrency:
  group: dq200-ad-feed
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q -r requirements.txt
      - name: Safety tests without external writes
        run: |
          python -m py_compile scripts/sync_dq200_live_feed.py
          python -m unittest discover -s tests -p test_sync_dq200_live_feed.py -v
      - name: Compare live site and protected prices; sync feed only when verified
        env:
          YANDEX_DIRECT_TOKEN: ${{ secrets.YANDEX_DIRECT_TOKEN }}
          YANDEX_DIRECT_LOGIN: ${{ secrets.YANDEX_DIRECT_LOGIN }}
        run: python -u scripts/sync_dq200_live_feed.py
      - name: Save only report, discard any unpushed feed commit
        if: always()
        run: |
          report=data/direct_recovery_20261124/automatic_feed_sync.json
          if test -f "$report"; then
            cp "$report" /tmp/dq200-sync-report.json
            git rebase --abort 2>/dev/null || true
            git fetch -q origin main
            git reset --hard FETCH_HEAD
            cp /tmp/dq200-sync-report.json "$report"
            bash .github/scripts/save_data.sh "$report"
          fi

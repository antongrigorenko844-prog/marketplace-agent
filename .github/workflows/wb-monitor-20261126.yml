          er=api("upload_errors","content","POST","/content/v2/cards/error/list",{"cursor":{"limit":100},"order":{"ascending":False}})
          eitems=(er.get("data") or {}).get("items",[]) if isinstance(er,dict) else []
          d["upload_errors"]=[{"vendorCodes":v.get("vendorCodes"),"errors":v.get("errors"),"updatedAt":v.get("updatedAt")} for v in eitems if v.get("errors")]
          defs={}
          for sub in sorted({c["subjectID"] for c in cards}):
              j=api("schema_"+str(sub),"content","GET","/content/v2/object/charcs/"+str(sub))
              if isinstance(j,dict) and isinstance(j.get("data"),list):defs[sub]=j["data"]
              time.sleep(0.65)
          d["schemas"]=defs
          d["coverage"]={"cards":len(cards),"trash":len(trash),"trash_complete":trash_complete,"price_complete":price_complete,"fbs_stock_complete":stock_complete,"master":len(master),"master_duplicate_skus":duplicates,"master_headers":head,"unique_sku":len(sku_groups),"schemas":len(defs)}
          d["trash"]=[{k:c.get(k) for k in ("vendorCode","nmID","imtID","subjectName","title")} for c in trash]
          d["duplicate_sku"]={k:v for k,v in sku_groups.items() if len(v)>1}
          d["shared_barcodes"]={k:v for k,v in barcode.items() if len(set(v))>1}
          d["multi_groups"]={str(k):v for k,v in group.items() if k and len(v)>1}
          d["not_in_master"]=[k for k in sku_groups if k not in master]
          d["master_not_in_wb"]=[k for k in master if k not in sku_groups]
          d["legacy_snapshot_count"]=len(cached)
          d["card_quality_rating_available"]=False
          d["design_tasks"]=[]
          for c in cards:

              fields.update({a["charcID"]:a for a in defs.get(c["subjectID"],[]) if "charcID" in a})
              filled=lambda v:v not in (None,[],{},"") and (not isinstance(v,list) or any(str(x).strip() for x in v))
              missing=[{"id":i,"name":a.get("name"),"required":a.get("required"),"popular":a.get("popular")} for i,a in fields.items() if not filled(cvals.get(i))]
              p=pby.get(nm,{})
              sids=[str(s["chrtID"]) for s in c.get("sizes",[]) if s.get("chrtID")]

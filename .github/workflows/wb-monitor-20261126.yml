              if not desc:flags.append("NO_DESCRIPTION")
              if not photo:flags.append("NO_PHOTO")
              elif len(photo)==1:flags.append("ONE_PHOTO")
              if not c.get("video"):flags.append("NO_VIDEO")
              if any(v.get("required") for v in missing):flags.append("MISSING_REQUIRED_CHARACTERISTICS")
              if sku not in master:flags.append("MASTER_IDENTITY_REVIEW")
              if len(sku_groups[sku])>1:flags.append("DUPLICATE_SKU")
              if any(nm in v for v in d["shared_barcodes"].values()):flags.append("SHARED_BARCODE")
              if text_diff or attr_diff:flags.append("APPROVED_CONTENT_MISMATCH")
              if not verdict.get("isFullyChecked") or verdict.get("reason"):flags.append("DOCUMENT_REVIEW")
              row={"sku":sku,"nmID":nm,"imtID":c.get("imtID"),"subjectID":c["subjectID"],"subjectName":c.get("subjectName"),"title":title,"description":desc,"brand":c.get("brand"),"dimensions":c.get("dimensions"),"sizes":c.get("sizes"),"characteristics":c.get("characteristics") or [],"missing_characteristics":missing,"documents":docs,"flags":flags,"photo_urls":[a.get("big") or a.get("hq") for a in photo],"photo_count":len(photo),"video":c.get("video"),"price":p,"fbs_stock":quantity,"stock_by_warehouse":bywh,"cost":master.get(sku,{}).get("Закупка, ₽"),"approved_text_diff":text_diff,"approved_characteristics_diff":attr_diff,"manifest_ids":m.get("ids"),"updatedAt":c.get("updatedAt"),"status":"REVIEW_REQUIRED" if flags else "NO_CHANGE_REQUIRED"}
              d["rows"][str(nm)]=row
              if len(photo)<4 or not c.get("video"):
                  d["design_tasks"].append({"sku":sku,"nmID":nm,"title":title,"priority":"high" if not photo else "normal","existing_photos":len(photo),"missing_video":not bool(c.get("video")),"status":"DESIGN_REQUIRED","brief":"Подготовить недостающие реальные ракурсы, маркировку и комплектацию именно этого артикула; сохранить текущую обложку, состояние, количество и конструкцию. Видео при отсутствии: короткий ролик с реальной деталью. Проверить миниатюру; не публиковать без проверки."})
          d["summary"]={"flags":dict(collections.Counter(f for r in d["rows"].values() for f in r["flags"])),"subjects":dict(collections.Counter(c.get("subjectName") for c in cards)),"doc_status":dict(collections.Counter(str((c.get("documents") or {}).get("overallVerdict",{}).get("status")) for c in cards)),"with_photo":sum(bool(c.get("photos")) for c in cards),"with_video":sum(bool(c.get("video")) for c in cards),"descriptions_match":sum("description" in manifest.get(c["vendorCode"],{}).get("text",{}).get("wb",{}) and c.get("description")==manifest[c["vendorCode"]]["text"]["wb"]["description"] for c in cards),"descriptions_planned":sum("description" in manifest.get(c["vendorCode"],{}).get("text",{}).get("wb",{}) for c in cards),"stock_zero":sum(r["fbs_stock"]==0 for r in d["rows"].values()),"stock_unknown":sum(r["fbs_stock"] is None for r in d["rows"].values()),"design_tasks":len(d["design_tasks"])}
          save()
          print("CATALOG",json.dumps(d["summary"],ensure_ascii=False),flush=True)
          today=dt.datetime.now(dt.timezone(dt.timedelta(hours=3))).date()
          end=today-dt.timedelta(days=1)
          def period(n):return {"start":str(end-dt.timedelta(days=n-1)),"end":str(end)}
          def collect_funnel():
              out={}
              for n in (7,14,30,90):
                  j=api("funnel_"+str(n),"analytics","POST","/api/analytics/v3/sales-funnel/products",{"selectedPeriod":period(n),"nmIds":[],"subjectIds":[],"brandNames":[],"tagIds":[],"skipDeletedNm":False,"limit":1000,"offset":0})
                  data=(j.get("data") or {}) if isinstance(j,dict) else {}
                  rows=data.get("products")
                  if isinstance(rows,list):out[str(n)]={"period":period(n),"products":rows,"complete":len(rows)<1000}
                  else:out[str(n)]={"period":period(n),"available":False}
                  if j is None and d["api"].get("funnel_"+str(n),{}).get("http") in (401,403):break
                  if n!=90:time.sleep(20)
              return out

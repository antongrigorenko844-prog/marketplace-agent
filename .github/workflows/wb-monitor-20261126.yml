name: LEOPARTS WB monitoring (read only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/wb-monitor-20261126.yml']
  workflow_dispatch:
  schedule:
    - cron: '0 5 29 11 *'
    - cron: '0 5 3,10,26 12 *'
permissions:
  contents: write
concurrency:
  group: marketplace-agent
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
      WB_WAREHOUSE_ID: ${{ secrets.WB_WAREHOUSE_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q -r requirements.txt
      - name: Read WB exact catalog and commercial data
        run: |
          PYTHONPATH=.:scripts python - <<'PY'
          import collections, datetime as dt, json, os, re, time, concurrent.futures, hashlib, subprocess
          from pathlib import Path
          import requests
          import wb_client as wb
          import content_manifest as cm
          from openpyxl import load_workbook

          ROOT=Path("data")
          local_day=dt.datetime.now(dt.timezone(dt.timedelta(hours=7))).date()
          if os.environ.get("GITHUB_EVENT_NAME")=="schedule" and str(local_day) not in {"2026-11-29","2026-12-03","2026-12-10","2026-12-26"}:
              print("Outside approved monitoring dates");raise SystemExit(0)
          OUT=ROOT/"wb_monitor"/(str(local_day)+"-"+os.environ.get("GITHUB_RUN_ID","manual")+".json")
          OUT.parent.mkdir(parents=True,exist_ok=True)
          baseline=json.loads(subprocess.check_output(["git","cat-file","-p","d3c44091bfa732a87eefff4fc61622c2850c1f93"]))
          def now():return dt.datetime.now(dt.timezone.utc).isoformat()
          d={"version":1,"platform":"wb","started":now(),"marketplace_writes":0,"api":{},"errors":{},"rows":{}}
          token=os.environ["WB_API_TOKEN"]
          # All requests use specific read methods; no general write transport.
          hosts={"content":"https://content-api.wildberries.ru","prices":"https://discounts-prices-api.wildberries.ru","market":"https://marketplace-api.wildberries.ru","analytics":"https://seller-analytics-api.wildberries.ru","finance":"https://finance-api.wildberries.ru","statistics":"https://statistics-api.wildberries.ru","advert":"https://advert-api.wildberries.ru","feedback":"https://feedbacks-api.wildberries.ru"}
          post_paths={"content":{"/content/v2/get/cards/list","/content/v2/get/cards/trash","/content/v2/cards/error/list"},"analytics":{"/api/analytics/v3/sales-funnel/products","/api/v2/search-report/report"},"finance":{"/api/finance/v1/sales-reports/detailed"}}
          def api(name,host,method,path,body=None,params=None):
              assert host in hosts and (method=="GET" or (method=="POST" and (path in post_paths.get(host,set()) or (host=="market" and re.fullmatch(r"/api/v3/stocks/[0-9]+",path)))))
              try:
                  res=requests.request(method,hosts[host]+path,json=body,params=params,headers={"Authorization":token,"Content-Type":"application/json"},timeout=45)
                  try:j=res.json()
                  except ValueError:j=None
                  d["api"][name]={"http":res.status_code,"response_type":type(j).__name__,"keys":list(j)[:15] if isinstance(j,dict) else None}
                  if not res.ok:
                      if isinstance(j,dict):d["api"][name]["error"]={k:str(j.get(k))[:350] for k in ("title","detail","errorText","message","code") if j.get(k)}
                      return None
                  return j
              except Exception as e:
                  d["errors"][name]=type(e).__name__;return None
          def list_cards(trash=False):
              out=[];cursor={"limit":100};seen=set();kind="trash" if trash else "list"
              for i in range(20):
                  f={} if trash else {"withPhoto":-1}
                  j=api(kind+"_"+str(i),"content","POST","/content/v2/get/cards/"+kind,{"settings":{"cursor":cursor,"filter":f}})
                  if not isinstance(j,dict) or not isinstance(j.get("cards"),list):return out,False
                  a=j["cards"];out+=a;c=j.get("cursor") or {}
                  if len(a)<100 or c.get("total",100)<100:return out,True
                  key=(c.get("trashedAt") if trash else c.get("updatedAt"),c.get("nmID"))
                  if None in key or key in seen:return out,False
                  seen.add(key);cursor={"limit":100,("trashedAt" if trash else "updatedAt"):key[0],"nmID":key[1]}
                  time.sleep(0.7)
              return out,False
          def save():

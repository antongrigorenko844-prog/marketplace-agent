              j=api("search_30","analytics","POST","/api/v2/search-report/report",{"currentPeriod":period(30),"positionCluster":"all","orderBy":{"field":"avgPosition","mode":"asc"},"includeSubstitutedSKUs":True,"includeSearchTexts":True,"limit":1000,"offset":0})
              return j if isinstance(j,dict) else None
          def collect_finance():
              # Compact aggregate only: do not retain buyer or order IDs.
              j=api("finance_90","finance","POST","/api/finance/v1/sales-reports/detailed",{"dateFrom":period(90)["start"],"dateTo":period(90)["end"],"limit":100000,"rrdId":0,"period":"weekly"})
              rows=j if isinstance(j,list) else (j.get("data") if isinstance(j,dict) else None)
              if not isinstance(rows,list):return {"available":False}
              names=("nmId","nmID","saName","vendorCode","supplierOperName","docTypeName","quantity","retailAmount","ppvzForPay","deliveryRub","storageFee","penalty","deduction","acceptance","additionalPayment","commissionPercent","ppvzSalesCommission","acquiringFee","returnAmount","rrDt","saleDt","rrdId")
              return {"available":True,"row_count":len(rows),"complete":len(rows)<100000,"keys":list(rows[0]) if rows else [],"rows":[{k:r[k] for k in names if k in r} for r in rows]}
          def collect_stats():

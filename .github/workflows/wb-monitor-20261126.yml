                  oo=[v for v in o.get("rows",[]) if start<=str(v.get("date",""))[:10]<=stop];ss=[v for v in s.get("rows",[]) if start<=str(v.get("date",""))[:10]<=stop]
                  sales=[v for v in ss if str(v.get("saleID","")).startswith("S")];returns=[v for v in ss if str(v.get("saleID","")).startswith("R")]
                  out["periods"][str(n)]={"start":start,"end":stop,"orders":len(oo) if o.get("available") else None,"cancelled":sum(v.get("isCancel") is True for v in oo) if o.get("available") else None,"sales":len(sales) if s.get("available") else None,"returns":len(returns) if s.get("available") else None,"buyer_gross":round(sum(v.get("finishedPrice") or 0 for v in sales),2) if s.get("available") else None,"net_forPay":round(sum(abs(v.get("forPay") or 0) for v in sales)-sum(abs(v.get("forPay") or 0) for v in returns),2) if s.get("available") else None}

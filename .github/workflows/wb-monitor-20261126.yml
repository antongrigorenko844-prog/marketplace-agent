                  return sum(flat) if flat and all(isinstance(v,int) for v in flat) else None
              q=[qty(x) for x in rows]
              out={"cards":len(rows),"positive_stock":sum(v is not None and v>0 for v in q),"zero_stock":sum(v==0 for v in q),"unknown_stock":sum(v is None for v in q),"one_photo":sum(x["photo_count"]==1 for x in rows),"no_photo":sum(x["photo_count"]==0 for x in rows),"no_video":sum(not x["video"] for x in rows),"documents_missing":sum(x.get("documents",{}).get("overallVerdict",{}).get("reason")=="documents_missing" for x in rows),"periods":{}}
              for n in (7,14,30,90):

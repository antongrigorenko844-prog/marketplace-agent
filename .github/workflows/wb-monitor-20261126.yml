                  for b in s.get("skus") or []:barcode[b].append(c["nmID"])
          master={};duplicates=[]
          w=load_workbook(ROOT/"master_control.xlsx",read_only=True,data_only=True);ws=w["Товары"] if "Товары" in w.sheetnames else w.active
          rr=ws.values;head=list(next(rr));cols={str(v):i for i,v in enumerate(head) if v}

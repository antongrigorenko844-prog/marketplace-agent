              quantity=sum(v for vs in bywh.values() for v in vs if isinstance(v,int)) if sids and bywh and all(len(vs)==len(sids) and all(isinstance(v,int) for v in vs) for vs in bywh.values()) and len(bywh)==len(wh or []) else None

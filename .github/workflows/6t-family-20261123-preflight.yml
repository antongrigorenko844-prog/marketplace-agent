name: LEOPARTS three new 6T30 family products preflight category discovery
on:
  push:
    branches: [main]
    paths: ['data/6t_family_20261123_preflight_request.json']
permissions:
  contents: write
concurrency:
  group: marketplace-agent
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q -r requirements.txt
      - name: Discover exact existing SKUs and suitable categories before new card uploads
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
          YANDEX_MARKET_API_KEY: ${{ secrets.YANDEX_MARKET_API_KEY }}
          YANDEX_MARKET_CAMPAIGN_ID: ${{ secrets.YANDEX_MARKET_CAMPAIGN_ID }}
        run: python scripts/6t_family_20261123_preflight.py
      - name: Save read-only evidence
        if: always()
        run: |
          if [ -f data/6t_family_20261123_preflight.json ]; then
            bash .github/scripts/save_data.sh data/6t_family_20261123_preflight.json
          fi

name: Verify pack counts and useful WB titles
on:
  push:
    branches: ['content/wb-verified-pack-counts-titles-20261121']
    paths: ['.github/workflows/wb-verified-units-titles.yml']
permissions:
  contents: read
concurrency:
  group: leoparts-wb-pack-count-title-write
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip -q install -r requirements.txt
      - name: Verify live card compositions, apply and read each batch back
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
        run: python scripts/wb_units_titles_20261121.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wb-pack-count-title-receipt
          path: wb_verified_receipt.json

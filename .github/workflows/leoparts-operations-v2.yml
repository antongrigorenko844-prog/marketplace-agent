name: LEOPARTS Operations v2 — fast media / stock audit / Avito / Tilda
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Select independent operation
        required: true
        type: choice
        default: status
        options: [status, media, stock, stock_dryrun, avito, tilda, tests]
      sku:
        description: Exact existing product SKU
        type: string
        default: '6t30'
      mode:
        description: inspect has no seller-account writes; apply media-only
        type: choice
        default: inspect
        options: [inspect, apply]
      channels:
        description: For media only, comma-separated ozon,wb,market
        type: string
        default: 'ozon,wb,market'
      confirm_media_apply:
        description: I authorize approved media updates for these channels and SKU
        type: boolean
        default: false
      autoload_ready:
        description: Avito subscription and autoload confirmed active
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['data/leoparts_ops_v2_smoke_request.json']
permissions: {contents: write}
concurrency:
  # Media-only checks cannot block warehouse jobs. Avito feed writes still
  # serialize with the existing marketplace-agent writer.
  group: ${{ inputs.operation == 'avito' && 'marketplace-agent' || format('leoparts-v2-{0}-{1}', inputs.operation || 'smoke', inputs.sku || '6t30') }}
  cancel-in-progress: false
jobs:
  operation:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install dependencies
        run: pip install -q -r requirements.txt
      - name: Safety and contract tests (no live writes)
        run: |
          set -e
          python -m unittest discover -s tests -p 'test_media_fast.py' -v
          python -m unittest discover -s tests -p 'test_stock_preflight.py' -v
          python -m unittest discover -s tests -p 'test_stock_legacy_deferred.py' -v
          python -m unittest discover -s tests -p 'test_tilda_cover_csv.py' -v
          python -m unittest discover -s tests -p 'test_ops_status.py' -v
          python -m unittest discover -s tests -p 'test_avito_fast_cover.py' -v
      - name: Run one isolated operation
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
          YANDEX_MARKET_API_KEY: ${{ secrets.YANDEX_MARKET_API_KEY }}
          YANDEX_MARKET_CAMPAIGN_ID: ${{ secrets.YANDEX_MARKET_CAMPAIGN_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MEDIA_APPLY_APPROVED: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_media_apply && 'true' || 'false' }}
          AVITO_AUTOLOAD_READY: ${{ github.event_name == 'workflow_dispatch' && inputs.autoload_ready && 'true' || 'false' }}
          OPERATION: ${{ github.event_name == 'workflow_dispatch' && inputs.operation || 'smoke' }}
          SKU: ${{ github.event_name == 'workflow_dispatch' && inputs.sku || '6t30' }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'inspect' }}
          CHANNELS: ${{ github.event_name == 'workflow_dispatch' && inputs.channels || 'ozon,wb,market' }}
        run: |
          set -euo pipefail
          case "$OPERATION" in
            smoke)
              python media_fast.py --sku 6t30 --mode inspect --channels ozon,wb,market
              python tilda_cover_csv.py --sku 6t30
              python stock_preflight.py --live
              python stock_sync_dryrun.py
              python avito_fast_cover.py --sku 6t30 --mode plan --check-release
              ;;
            media)
              python media_fast.py --sku "$SKU" --mode "$MODE" --channels "$CHANNELS"
              ;;
            stock) python stock_preflight.py --live ;;
            stock_dryrun) python stock_sync_dryrun.py ;;
            tilda)
              if [ "$MODE" = "apply" ]; then
                echo "::error::Tilda has no verified automatic cover-replace endpoint; CSV preparation is read-only."
                exit 1
              fi
              python tilda_cover_csv.py --sku "$SKU"
              ;;
            avito)
              if [ "$MODE" = "apply" ] && [ "$AVITO_AUTOLOAD_READY" != "true" ]; then
                echo "::error::Avito autoload must be confirmed active."
                exit 1
              fi
              case "$MODE" in
                inspect) python avito_fast_cover.py --sku "$SKU" --mode plan --check-release ;;
                apply) python avito_fast_cover.py --sku "$SKU" --mode apply --check-release ;;
              esac
              ;;
            status|tests) echo "Read-only checks; no seller-account edits" ;;
            *) echo "::error::Unknown operation"; exit 1 ;;
          esac
      - name: Produce truthful status report from channel evidence
        if: always()
        run: python ops_status.py
      - name: Save operational reports only
        if: always()
        run: |
          bash .github/scripts/save_data.sh \
            data/media_fast_report.json \
            data/stock_preflight_report.json \
            data/stock_sync_dryrun_report.json \
            data/tilda_cover_plan_report.json \
            data/tilda_cover_patch.csv \
            data/avito_fast_cover_report.json \
            data/leoparts_ops_status.json \
            data/leoparts_ops_status.md \
            data/avito_feed.xlsx

name: Update two Avito rod kit prices
on: workflow_dispatch
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - env:
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          import avito_client as av
          owner = av._request("GET", "/core/v1/accounts/self")["id"]
          targets = {8415982473:"0am325091f-set", 8345137262:"0am325091e-set"}
          for item, sku in targets.items():
              info = av._request("GET", f"/core/v1/accounts/{owner}/items/{item}/")
              assert str(info.get("autoload_item_id","")).lower() == sku, (item,info.get("autoload_item_id"))
          for item in targets:
              result = av._request("POST",f"/core/v1/items/{item}/update_price",json={"price":5800})
              print(item,result)
              assert result.get("result",{}).get("success"), result
          prices = {i["id"]:i.get("price") for i in av.list_all_items() if i.get("id") in targets}
          print("Verified prices",prices)
          PY

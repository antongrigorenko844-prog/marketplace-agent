name: direct-adgroup-audit
on:
  push:
    branches: [main]
    paths: ['.github/agent-requests/direct-adgroup-audit.txt']
permissions:
  contents: write
concurrency:
  group: marketplace-agent
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch read-only 30-day ad group performance
        env:
          YANDEX_DIRECT_TOKEN: ${{ secrets.YANDEX_DIRECT_TOKEN }}
          YANDEX_DIRECT_LOGIN: ${{ secrets.YANDEX_DIRECT_LOGIN }}
        run: python .github/scripts/direct_adgroup_audit.py
      - name: Save report
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add data/direct_adgroup_audit.tsv
          git diff --cached --quiet || (git commit -m "Update Direct ad group audit" && git fetch origin main && git rebase origin/main && git push)

name: Repair product kit titles on WB
on: workflow_dispatch
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - env:
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
        run: python scripts/fix_wb_title_repairs.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wb-title-repairs
          path: /tmp/wb-title-repairs/

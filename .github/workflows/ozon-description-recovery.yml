name: LEOPARTS Ozon description recovery probe
on:
  push:
    branches: [main]
    paths: [data/ozon_description_recovery_request.json]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: marketplace-agent
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_ozon_description_recovery.py' -v
      - name: Recover Ozon description-only write on a guarded singleton
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
        run: python scripts/ozon_description_recovery_20261124.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ozon-recovery-${{ github.run_id }}
          path: reports/content-ozon-recovery/
          retention-days: 30

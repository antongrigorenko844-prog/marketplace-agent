name: Align two Avito bolt kit prices
on: workflow_dispatch
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - env:
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          import avito_client as av
          targets = {8232271969: 2350, 4284998704: 1890}
          def prices():
              return {i["id"]: i.get("price") for i in av.list_all_items() if i.get("id") in targets}
          before = prices()
          assert set(before) == set(targets) and all(before[i] in (targets[i],2350) for i in targets), before
          for item in targets:
              if before[item] != 2350:
                  result = av._request("POST",f"/core/v1/items/{item}/update_price",json={"price":2350})
                  assert result.get("result",{}).get("success"), (item,result)
          after = prices()
          print("Verified prices", after)
          assert after == dict.fromkeys(targets,2350)
          PY

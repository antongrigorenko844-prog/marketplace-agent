name: Verify Avito DQ200 video feed
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt
      - env:
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          import re,json
          import avito_client as av
          for suffix in ("current","last_successful"):
              try:
                  state=av._request("GET",f"/autoload/v4/uploads/{suffix}")
                  print("AV V4",suffix,{k:v for k,v in state.items() if "url" not in k and k not in ("events","section_stats")},flush=True)
              except Exception as e: print("AV V4 ERROR",suffix,e,flush=True)
          report=av.get_autoload_report_items()
          print("AV REPORT",report["report"],flush=True)
          pattern=re.compile(r"0AM927769[GKE]|0am325025HX[GKE]",re.I)
          for row in report["items"]:
              if pattern.search(json.dumps(row,ensure_ascii=False)): print("AV ROW",row,flush=True)
          for row in av.list_all_items():
              if pattern.search(str(row.get("title",""))): print("AV LIST",{k:row.get(k) for k in ("id","title","status","url","video","videos")},flush=True)
          PY

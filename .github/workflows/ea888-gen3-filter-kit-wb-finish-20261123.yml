name: LEOPARTS EA888 Gen3 full kit WB gallery prices stock finish
on:
  push:
    branches: [main]
    paths: ['data/ea888_gen3_full_kit_wb_finish_20261123_request.json']
permissions: {contents: write}
concurrency: {group: marketplace-agent, cancel-in-progress: false}
jobs:
  wb:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q -r requirements.txt
      - name: Update only new WB kit with 3 images price 7850 and 40 units
        env:
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
          WB_WAREHOUSE_ID: ${{ secrets.WB_WAREHOUSE_ID }}
        run: python -u scripts/ea888_gen3_full_kit_wb_finish_20261123.py
      - name: Save verification
        if: always()
        run: bash .github/scripts/save_data.sh data/ea888_gen3_full_kit_wb_finish_20261123_result.json

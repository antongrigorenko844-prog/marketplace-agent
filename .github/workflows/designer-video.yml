name: Send ready videos to designer
on:
  schedule:
    - cron: '25 7 * * 1,4'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: marketplace-agent-designer-video
  cancel-in-progress: false
jobs:
  send:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Reserve the next video before contacting Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python designer_video.py prepare
          bash .github/scripts/save_data.sh data/designer_video_sent.json
      - name: Deliver the video and publication text together
        id: delivery
        run: python designer_video.py send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      - name: Save the delivery receipt
        if: always() && steps.delivery.outcome != 'skipped'
        run: bash .github/scripts/save_data.sh data/designer_video_sent.json

name: Correct confirmed DQ200 package dimensions
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply confirmed dimensions only
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: marketplace-agent
  cancel-in-progress: false
jobs:
  dimensions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt
      - name: Inspect or correct dimensions only
        env:
          APPLY_DIMENSIONS: ${{ inputs.apply }}
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
          YANDEX_MARKET_API_KEY: ${{ secrets.YANDEX_MARKET_API_KEY }}
          YANDEX_MARKET_CAMPAIGN_ID: ${{ secrets.YANDEX_MARKET_CAMPAIGN_ID }}
        run: python scripts/correct_package_dimensions.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-dimensions-verification
          path: /tmp/package-dimensions-result/

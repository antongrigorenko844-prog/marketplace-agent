name: tilda-one-product-review-preview
on:
  push:
    branches: [main]
    paths: ['.github/agent-requests/tilda-one-product-review-preview.txt']
permissions:
  contents: write
concurrency:
  group: marketplace-agent
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Preview one Tilda product, no API writes
        run: python .github/scripts/tilda_one_product_review_preview.py
      - name: Save isolated preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tilda_review_one_product_preview.json
          git diff --cached --quiet || (git commit -m "Save isolated Tilda review preview" && git pull --rebase && git push)

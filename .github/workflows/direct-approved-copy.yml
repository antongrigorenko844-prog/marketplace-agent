name: direct-approved-copy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/agent-requests/direct-approved-copy.txt'
permissions:
  contents: write
concurrency:
  group: marketplace-agent
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply the approved mechatronics copy with live guards
        env:
          YANDEX_DIRECT_TOKEN: ${{ secrets.YANDEX_DIRECT_TOKEN }}
          YANDEX_DIRECT_LOGIN: ${{ secrets.YANDEX_DIRECT_LOGIN }}
        run: python .github/scripts/direct_approved_copy.py --apply
      - name: Save verified result and before snapshot
        if: always()
        run: |
          if [ -f data/direct_approved_copy_20261119.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/direct_approved_copy_20261119.json
            git diff --cached --quiet || (git commit -m "Record approved Direct copy result" && git pull --rebase && git push)
          fi

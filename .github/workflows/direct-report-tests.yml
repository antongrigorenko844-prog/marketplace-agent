name: Verify Direct Telegram report safety
on:
  push:
    branches: [main]
    paths:
      - direct_tools.py
      - direct_commercial_evidence.py
      - tests/test_direct_commercial_evidence.py
      - .github/scripts/direct_traffic_quality_20261126.py
      - .github/scripts/direct_targeted_readonly_20261126.py
      - data/direct_audit_20261126/payment_evidence.json
      - tests/test_direct_report_scope.py
      - tests/test_direct_metrika_report.py
      - .github/workflows/run-command.yml
      - .github/workflows/direct-report-tests.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Run offline regression tests (no API credentials)
        run: python -m unittest discover -s tests -p test_direct_report_scope.py -v
      - name: Test Metrica aggregate reporting and secrets redaction
        run: python -m unittest discover -s tests -p test_direct_metrika_report.py -v
      - name: Verify exact campaign attribution and unpaid-order separation
        run: |
          python -m py_compile direct_commercial_evidence.py direct_tools.py .github/scripts/direct_traffic_quality_20261126.py .github/scripts/direct_targeted_readonly_20261126.py
          python -m unittest discover -s tests -p test_direct_commercial_evidence.py -v

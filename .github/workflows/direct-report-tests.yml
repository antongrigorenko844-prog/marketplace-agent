name: Verify Direct Telegram report safety
on:
  push:
    branches: [main]
    paths:
      - direct_tools.py
      - tests/test_direct_report_scope.py
      - .github/workflows/direct-report-tests.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Run offline regression tests (no API credentials)
        run: python -m unittest discover -s tests -p test_direct_report_scope.py -v

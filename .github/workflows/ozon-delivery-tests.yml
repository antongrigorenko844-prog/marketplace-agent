name: Ozon Delivery isolated tests
on:
  push:
    branches:
      - feature/ozon-delivery-st100-prototype
    paths:
      - 'integrations/ozon_delivery/**'
      - '.github/workflows/ozon-delivery-tests.yml'
  pull_request:
    paths:
      - 'integrations/ozon_delivery/**'
      - '.github/workflows/ozon-delivery-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run isolated Ozon Delivery tests
        run: python -m unittest discover -s integrations/ozon_delivery -t . -p 'test_*.py' -v
      - name: Test read-only ST100 probe
        run: |
          node integrations/ozon_delivery/test_st100_readonly_probe.cjs
          node integrations/ozon_delivery/test_quote_state.cjs

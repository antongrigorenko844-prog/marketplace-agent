name: direct-mass-negatives-apply-20261120
on:
  push:
    branches: [main]
    paths:
      - '.github/agent-requests/direct-mass-negatives-apply-20261120.txt'
permissions:
  contents: write
concurrency:
  group: marketplace-agent
  cancel-in-progress: false
jobs:
  guarded-campaign-negatives:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run only the explicitly requested guarded mode
        env:
          YANDEX_DIRECT_TOKEN: ${{ secrets.YANDEX_DIRECT_TOKEN }}
          YANDEX_DIRECT_LOGIN: ${{ secrets.YANDEX_DIRECT_LOGIN }}
        run: python .github/scripts/direct_mass_negatives_apply_20261120.py
      - name: Save bounded operation reports
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for report in data/direct_mass_negatives_preflight_20261120.json data/direct_mass_negatives_apply_20261120.json data/direct_mass_negatives_apply_blocked_20261120.json data/direct_mass_negatives_check_20261120.json data/direct_mass_negatives_rollback_new_20261120.json; do
            if [ -f "$report" ]; then
              git add -- "$report"
            fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Record guarded Direct mass-negative operation [skip ci]"
            git pull --rebase
            git push
          fi

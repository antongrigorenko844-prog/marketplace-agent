# Публикация постов в VK и Instagram (см. social_publish.py).
#
# По расписанию (каждый день в 07:00 UTC = 10:00 МСК) запускается автопубликация:
# один самый ранний пост на площадку, у которого уже наступила дата в
# data/content_plan.xlsx и есть готовые картинки в social/<№>/. Работает ТОЛЬКО
# если в Secrets задан SOCIAL_AUTOPUBLISH = 1 — иначе ничего не публикуется.
# Вручную: Actions -> marketplace-agent-social -> Run workflow.

name: marketplace-agent-social

on:
  schedule:
    - cron: "0 7 * * *"
    - cron: "0 13 24 10 *"   # РАЗОВО: пост №1 в сб 24.10.2026 в 16:00 МСК (в другие годы код пропустит)
  workflow_dispatch:
    inputs:
      command:
        description: "Что сделать"
        required: true
        default: "social-status"
        type: choice
        options:
          - social-status
          - social-test
          - social-vk-feed
          - social-publish-dryrun
          - social-publish
          - plan-reorder-dryrun
          - plan-reorder
      article:
        description: "Номера постов через запятую (принудительно, независимо от даты). Пусто — по расписанию"
        required: false
        default: ""
        type: string

concurrency:
  group: marketplace-agent
  cancel-in-progress: false

jobs:
  social:
    uses: ./.github/workflows/run-command.yml
    secrets: inherit
    with:
      command: ${{ github.event.inputs.command || (github.event.schedule == '0 13 24 10 *' && 'social-publish' || 'social-autopublish') }}
      article: ${{ github.event.inputs.article || (github.event.schedule == '0 13 24 10 *' && '1@2026-10-24' || '') }}

# Ручные проверки контент-плана и ссылок. Посты публикует дизайнер.

name: marketplace-agent-social

on:
  workflow_dispatch:
    inputs:
      command:
        description: "Что сделать"
        required: true
        default: "social-status"
        type: choice
        options:
          - social-status
          - social-test
          - site-links
          - store-links
          - plan-reorder-dryrun
          - plan-reorder
      article:
        description: "Номера постов через запятую (принудительно, независимо от даты). Пусто — по расписанию"
        required: false
        default: ""
        type: string

concurrency:
  group: marketplace-agent
  cancel-in-progress: false

jobs:
  social:
    uses: ./.github/workflows/run-command.yml
    secrets: inherit
    with:
      command: ${{ github.event.inputs.command }}
      article: ${{ github.event.inputs.article }}
      save_log: true
      log_file: data/social_last_run.txt   # вывод последнего запуска — Claude читает его, логи Actions ему недоступны

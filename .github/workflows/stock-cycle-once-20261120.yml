name: LEOPARTS approved stock cycle 20261120
on:
  push:
    branches: [main]
    paths: ['.github/workflows/stock-cycle-once-20261120.yml']
permissions:
  contents: write
concurrency:
  group: marketplace-agent
  cancel-in-progress: false
jobs:
  stock:
    if: github.event.before == 'de692788d0e633e86ba5c60bcbb115d655e001af' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Reconcile and publish inventory
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          OZON_WAREHOUSE_ID: ${{ secrets.OZON_WAREHOUSE_ID }}
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
          WB_WAREHOUSE_ID: ${{ secrets.WB_WAREHOUSE_ID }}
          YANDEX_MARKET_API_KEY: ${{ secrets.YANDEX_MARKET_API_KEY }}
          YANDEX_MARKET_CAMPAIGN_ID: ${{ secrets.YANDEX_MARKET_CAMPAIGN_ID }}
          TILDA_COMMERCEML_URL: ${{ secrets.TILDA_COMMERCEML_URL }}
          TILDA_COMMERCEML_USER: ${{ secrets.TILDA_COMMERCEML_USER }}
          TILDA_COMMERCEML_PASSWORD: ${{ secrets.TILDA_COMMERCEML_PASSWORD }}
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
          AVITO_SELLER_ADDRESS: ${{ secrets.AVITO_SELLER_ADDRESS }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python main.py --sync-orders
          bash .github/scripts/save_data.sh data/
          failed=0
          python main.py --push-stock || failed=1
          python main.py --push-wb-stock || failed=1
          if [ -n "$YANDEX_MARKET_API_KEY" ]; then python main.py --push-yandex-stock || failed=1; fi
          python main.py --build-avito-catalog || failed=1
          if [ -n "$TILDA_COMMERCEML_URL" ]; then python main.py --push-tilda || failed=1; fi
          exit "$failed"
      - name: Save data back to repo
        if: always()
        run: bash .github/scripts/save_data.sh data/ photos/

name: WB deep sales audit read only
on: workflow_dispatch
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt
      - name: Read WB order statuses reviews and price history
        env:
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
        run: |
          python - <<'PY'
          import os,json,pathlib,time,datetime,requests
          import wb_client as wb
          from config import config
          out=pathlib.Path('wb-audit-output');out.mkdir(exist_ok=True)
          s=requests.Session();s.headers.update({'Authorization':os.environ['WB_API_TOKEN']})
          def save(n,d): (out/(n+'.json')).write_text(json.dumps(d,ensure_ascii=False,indent=2))
          def api(n,m,b,p,j=None):
              r=s.request(m,b+p,json=j,timeout=70)
              try:d=r.json()
              except ValueError:d={'text':r.text[:500]}
              if not r.ok: print(n,'ERROR',r.status_code,str(d)[:200],flush=True);save(n,{'status':r.status_code,'error':d});return None
              print(n,'OK',flush=True);return d
          def epoch(d):return int(datetime.datetime.fromisoformat(d).replace(tzinfo=datetime.timezone.utc).timestamp())
          all_orders=[]
          for a,b in [('2026-08-17','2026-09-15'),('2026-09-15','2026-10-14'),('2026-10-14','2026-11-13')]:
              nxt=0
              for pg in range(10):
                  d=api('fbs-'+a+'-'+str(pg),'GET',config.wb_marketplace_base,f'/api/v3/orders?limit=1000&next={nxt}&dateFrom={epoch(a)}&dateTo={epoch(b)}')
                  if not d:break
                  all_orders.extend(d.get('orders',[]))
                  if not d.get('orders') or len(d['orders'])<1000 or d.get('next')==nxt:break
                  nxt=d['next'];time.sleep(1)
          keys=('id','rid','srid','article','nmId','createdAt','price','convertedPrice','warehouseId','supplyId','orderUid','skus','cancelReason')
          clean=[{k:v for k,v in x.items() if k in keys} for x in all_orders]
          save('fbs-orders',clean);print('FBS_COUNT',len(clean),flush=True)
          for i in range(0,len(clean),1000):
              ids=[x['id'] for x in clean[i:i+1000]]
              d=api('fbs-statuses','POST',config.wb_marketplace_base,'/api/v3/orders/status',{'orders':ids})
              save('fbs-statuses-'+str(i),d)
          for answered in ('true','false'):
              d=api('feedbacks-'+answered,'GET','https://feedbacks-api.wildberries.ru',f'/api/v1/feedbacks?isAnswered={answered}&take=10000&skip=0&order=dateDesc')
              if d:
                  keys=('id','text','pros','cons','productValuation','createdDate','answer','productDetails','wasViewed')
                  save('feedbacks-'+answered,[{k:v for k,v in x.items() if k in keys} for x in d.get('data',{}).get('feedbacks',[])])
          d=api('live-prices','GET',config.wb_prices_base,'/api/v2/list/goods/filter?limit=1000&offset=0')
          save('live-prices',d)
          d=api('archived-orders','GET',config.wb_marketplace_base,'/api/marketplace/v3/fbs/orders/archive?limit=1000&next=0&dateFrom='+str(epoch('2026-05-01'))+'&dateTo='+str(epoch('2026-05-30')))
          if d:save('archived-orders',d)
          print('FOLLOWUP_READ_ONLY_COMPLETE',flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wb-deep-audit-followup
          path: wb-audit-output/
          retention-days: 7


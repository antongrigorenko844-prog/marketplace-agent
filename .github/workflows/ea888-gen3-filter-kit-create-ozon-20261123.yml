name: LEOPARTS create EA888 Gen3 housing valve filter kit on Ozon
on:
  push:
    branches: [main]
    paths: ['data/ea888_gen3_full_kit_ozon_create_20261123_request.json']
permissions: {contents: write}
concurrency: {group: marketplace-agent, cancel-in-progress: false}
jobs:
  ozon:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q -r requirements.txt
      - name: Create and confirm exact Ozon full EA888 Gen3 filter kit
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          OZON_WAREHOUSE_ID: ${{ secrets.OZON_WAREHOUSE_ID }}
        run: |
          python -m py_compile scripts/ea888_gen3_full_kit_ozon_create_20261123.py
          python -u scripts/ea888_gen3_full_kit_ozon_create_20261123.py
      - name: Save Ozon readback
        if: always()
        run: |
          if [ -f data/ea888_gen3_full_kit_ozon_result_20261123.json ]; then
            bash .github/scripts/save_data.sh data/ea888_gen3_full_kit_ozon_result_20261123.json
          fi

name: LEOPARTS Avito Correct Ordinary Boot to 450 — Guarded
on:
  push:
    branches: [main]
    paths: ['data/avito_plain_boot_restore_20261124_request.json']
permissions: {contents: write}
concurrency:
  group: marketplace-agent
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q requests openpyxl python-dotenv
      - name: Owner requested price correction Avito ONLY; staged feed & two seller ads
        env:
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m py_compile scripts/avito_plain_boot_450_restore_20261124.py
          python -u scripts/avito_plain_boot_450_restore_20261124.py
      - name: Save verification receipts; avoid changing unrelated data
        if: always()
        run: |
          if [ -f data/avito_plain_boot_restore_20261124_result.json ]; then
            bash .github/scripts/save_data.sh data/avito_plain_boot_restore_20261124_result.json
          fi

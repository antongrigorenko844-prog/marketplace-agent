name: Correct Ozon solenoid product types
on: workflow_dispatch
permissions:
  contents: read
jobs:
  market:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt
      - env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
        run: |
          python - <<'PY'
          import ozon_client as oz
          import catalog_editor as ce
          ids = ["6t30","0AM325473","0am325025n"]
          category, target = 17028756, 970984897
          schemas = {}
          for kind in (target,971100605):
              schemas[kind] = {a["id"]:a for a in oz.get_category_attributes(category,kind)}
          for row in oz.get_product_names(ids):
              print("LIVE",row.get("offer_id"),row.get("id"),row.get("sku"),row.get("type_id"),flush=True)
          for row in oz.get_prices_and_stocks(ids):
              print("SALE",row.get("offer_id"),row.get("id"),row.get("statuses"),row.get("is_archived"),flush=True)
          PY

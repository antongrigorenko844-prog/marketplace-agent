name: Audit marketplace categories and WB orders
on: workflow_dispatch
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt
      - env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
          YANDEX_MARKET_API_KEY: ${{ secrets.YANDEX_MARKET_API_KEY }}
          YANDEX_MARKET_CAMPAIGN_ID: ${{ secrets.YANDEX_MARKET_CAMPAIGN_ID }}
        run: |
          python - <<'PY'
          import re
          import wb_client as wb
          import ozon_client as oz
          import yandex_market_client as ym
          pattern = re.compile(r"соленоид|гидроблок|ремкомплект.*кпп|запчасти.*короб|болты.*авто|креп[её]ж.*авто|запчасти.*фильтр|корпус.*фильтр|прокладк.*кпп",re.I)
          for query in ("соленоид","гидроблок","крепеж","болт","ремкомплект кпп","фильтр акпп","корпус масляного"):
              print("WB_TARGET",query,wb.get_subjects(parent_id=760,name=query),flush=True)
          def walk(nodes,category=None):
              for row in nodes:
                  name=row.get("category_name") or row.get("type_name") or row.get("name") or ""
                  cid=row.get("description_category_id") or row.get("id") or category
                  if pattern.search(name):
                      print("TARGET",cid,row.get("type_id"),name,row.get("disabled"),flush=True)
                  walk(row.get("children",[]),cid)
          walk(oz._post("/v1/description-category/tree",{"language":"RU"})["result"])
          print("YM_TREE",flush=True)
          _, tree=ym._request("POST","/v2/categories/tree",json_body={"language":"RU"})
          walk([tree["result"]])
          PY

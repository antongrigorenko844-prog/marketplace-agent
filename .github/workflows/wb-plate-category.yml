name: Correct Ozon solenoid product types
on: workflow_dispatch
permissions:
  contents: read
jobs:
  market:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt
      - env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
        run: |
          python - <<'PY'
          import ozon_client as oz
          import catalog_editor as ce
          ids = ["6t30","0AM325473","0am325025n"]
          category, target = 17028756, 970984897
          schemas = {}
          for kind in (target,971100605):
              schemas[kind] = {a["id"]:a for a in oz.get_category_attributes(category,kind)}
          import time
          from decimal import Decimal
          wanted = schemas[target]
          anchor, = oz.get_product_names(["0AM325025B"])
          assert (anchor["description_category_id"],anchor["type_id"]) == (category,target)
          type_field, = [a for a in anchor["attributes"] if a["id"] == 8229]
          assert any(v.get("value") == "Соленоид КПП" for v in type_field["values"])
          cards = {x["offer_id"]:x for x in oz.get_product_names(ids)}
          prices = {x["offer_id"]:x for x in oz.get_prices_and_stocks(ids)}
          items = []
          for sku in ids:
              card = cards[sku]
              assert card["description_category_id"] == category
              if card["type_id"] == target: continue
              assert card["type_id"] == 971100605
              item = ce._build_one_item(card,prices[sku],{})
              item["attributes"] = [a for a in card["attributes"] if a["id"] != 8229] + [type_field]
              assert all(a["id"] in wanted for a in item["attributes"])
              assert {i for i,a in wanted.items() if a.get("is_required")} <= {a["id"] for a in item["attributes"] if a.get("values")}
              assert not ce._load_overrides().get(sku,{}).get("dims_mm")
              assert not ce._load_overrides().get(sku,{}).get("weight_g")
              assert Decimal(item["price"]) > 0 and item["name"] == card["name"]
              item["type_id"] = target
              item["new_description_category_id"] = category
              items.append(item)
          if items:
              response = oz._post("/v3/product/import",{"items":items})
              print("IMPORT",response,flush=True)
              task = response["result"]["task_id"]
              for attempt in range(6):
                  result = oz._post("/v1/product/import/info",{"task_id":task})
                  print("TASK",result,flush=True)
                  rows = result.get("result",{}).get("items",[])
                  if rows and all(row.get("status") not in ("pending","processing") for row in rows): break
                  time.sleep(10)
          live = {x["offer_id"]:x for x in oz.get_product_names(ids)}
          live_prices = {x["offer_id"]:x for x in oz.get_prices_and_stocks(ids)}
          for sku in ids:
              current = live[sku]
              print("VERIFY",sku,current.get("type_id"),current.get("sku"),flush=True)
              assert ce._price_block(prices[sku]).get("price") == ce._price_block(live_prices[sku]).get("price"),sku
          PY

name: Correct Ozon solenoid product types
on: workflow_dispatch
permissions:
  contents: read
jobs:
  market:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt
      - env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
        run: |
          python - <<'PY'
          import ozon_client as oz
          import catalog_editor as ce
          ids = ["6t30","0AM325473","0am325025n"]
          category, target = 17028756, 970984897
          schemas = {}
          for kind in (target,971100605):
              schemas[kind] = {a["id"]:a for a in oz.get_category_attributes(category,kind)}
          wanted = schemas[target]
          cards = {x["offer_id"]:x for x in oz.get_product_names(ids)}
          prices = {x["offer_id"]:x for x in oz.get_prices_and_stocks(ids)}
          for sku in ids:
              card = cards[sku]
              assert card["description_category_id"] == category
              if card["type_id"] == target:
                  print("ALREADY",sku)
                  continue
              assert card["type_id"] == 971100605
              item = ce._build_one_item(card,prices[sku],{})
              fields = {a["id"]:a for a in item["attributes"]}
              missing = [(i,a["name"]) for i,a in wanted.items() if a.get("is_required") and (i not in fields or not fields[i].get("values")) and i != 8229]
              print("PREFLIGHT",sku,"missing",missing,"required",[(i,a["name"]) for i,a in wanted.items() if a.get("is_required")],"removed",[(i,schemas[971100605].get(i,{}).get("name")) for i in fields if i not in wanted],flush=True)
          PY

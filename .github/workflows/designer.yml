# Telegram-бот для дизайнера (см. designer_bot.py).
# Расписание (будни):
#   09:15 МСК (06:15 UTC)  -> designer-send: задание на пост следующего рабочего дня + исходные фото
#   09:45 МСК (06:45 UTC)  -> запасной designer-send (дубль не уходит)
#   после Push файлов в data/outbox/ -> designer-collect сразу
#   каждые 30 минут днём   -> designer-collect: забирает присланные макеты в social/<№>/
# Без секрета TELEGRAM_BOT_TOKEN и без designer-link команды ничего не делают.
# Вручную: Actions -> marketplace-agent-designer -> Run workflow.

name: marketplace-agent-designer

on:
  schedule:
    - cron: "41 5 * * *"        # 08:41 МСК ЕЖЕДНЕВНО — владельцу на проверку посты на 8 дней вперёд (новые)
    - cron: "15 6 * * 1-5"      # 09:15 МСК — задание дизайнеру
    - cron: "45 6 * * 1-5"      # 09:45 МСК — запасной запуск (повтор не отправляется: бот помнит отправленное)
    - cron: "*/30 5-17 * * 1-5"
  push:                         # после Commit+Push сообщений для дизайнера бот отправляет их сразу
    paths:
      - "data/outbox/**"
      - "data/post_texts/**"
      - "data/content_plan.xlsx"
  workflow_dispatch:
    inputs:
      command:
        description: "Что сделать"
        required: true
        default: "designer-send-dryrun"
        type: choice
        options:
          - designer-link
          - designer-send-dryrun
          - designer-send
          - designer-collect
          - owner-preview
      article:
        description: "Номер поста (пусто — пост следующего рабочего дня). Для designer-link: слово owner — привязать ВАШ чат"
        required: false
        default: ""
        type: string

concurrency:
  group: marketplace-agent
  cancel-in-progress: false

jobs:
  designer:
    uses: ./.github/workflows/run-command.yml
    secrets: inherit
    with:
      command: ${{ github.event.inputs.command || (github.event.schedule == '41 5 * * *' && 'owner-preview' || ((github.event.schedule == '15 6 * * 1-5' || github.event.schedule == '45 6 * * 1-5') && 'designer-send' || 'designer-collect')) }}
      article: ${{ github.event.inputs.article || '' }}

name: LEOPARTS Verify Public Tilda DSG Kit Images
on:
  push:
    branches: [main]
    paths: ['data/leoparts_dsg_tilda_visual_verify_20261123_request.json']
permissions: {contents: write}
concurrency: {group: marketplace-agent, cancel-in-progress: false}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q -r requirements.txt
      - run: |
          python -m py_compile scripts/leoparts_dsg_tilda_visual_verify_20261123.py
          python -u scripts/leoparts_dsg_tilda_visual_verify_20261123.py
      - if: always()
        run: |
          test ! -f data/leoparts_dsg_tilda_visual_verify_20261123_result.json || bash .github/scripts/save_data.sh data/leoparts_dsg_tilda_visual_verify_20261123_result.json

name: Verify two DSG tool listings
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dsg-tools-live-audit.yml
      - .github/scripts/dsg_tools_live_audit.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dsg-tools-live-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing read client dependencies
        run: python -m pip install requests python-dotenv
      - name: Read seller catalogs and public website
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
          YANDEX_MARKET_API_KEY: ${{ secrets.YANDEX_MARKET_API_KEY }}
          YANDEX_MARKET_CAMPAIGN_ID: ${{ secrets.YANDEX_MARKET_CAMPAIGN_ID }}
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
        run: python .github/scripts/dsg_tools_live_audit.py --retry-failed
      - name: Preserve result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsg-tools-live-audit
          path: data/dsg_tools_live_audit_20261120.json
          retention-days: 7
      - name: Save only the audit report
        if: always()
        run: bash .github/scripts/save_data.sh data/dsg_tools_live_audit_20261120.json

name: LEOPARTS view original intake screw photo only
on:
  push:
    branches: [main]
    paths: ['data/repair_vint_ea888_photo_only_20261123_request.json']
permissions:
  contents: write
concurrency:
  group: leoparts-vint-photo-only
  cancel-in-progress: false
jobs:
  photo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q pillow
      - name: Generate photo preview from original owner media in repo
        run: python scripts/repair_vint_ea888_photo_only_20261123.py
      - name: Persist preview for visual verification
        run: bash .github/scripts/save_data.sh data/repair_vint_ea888_photo_only_20261123.b64

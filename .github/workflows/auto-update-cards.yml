# Content commits never run prices, stocks, creation or archives.
name: marketplace-agent-auto-content
permissions:
  contents: write
on:
  push:
    branches: [main]
    paths:
      - data/master_control.xlsx
      - data/content_updates.json
      - data/content_manifest.json
      - data/content_sync_request.json
      - data/market_video_sources.json
      - data/package_dimensions.json
      - photos/**
      - photos_avito/**
      - data/ozon_rich/**
      - content_sync.py
      - content_manifest.py
      - content_transport.py
jobs:
  content:
    uses: ./.github/workflows/content-sync.yml
    secrets: inherit

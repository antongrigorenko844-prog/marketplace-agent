name: LEOPARTS diagnose EA888 intake manifold screw Ozon wrong product type
on:
  push:
    branches: [main]
    paths: ['data/repair_vint_ea888_ozon_diag_20261123_request.json']
permissions:
  contents: write
concurrency:
  group: leoparts-vint-ea888-ozon-readonly
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q -r requirements.txt
      - name: Read screw Ozon item status category and supported types
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
        run: |
          python -m py_compile scripts/repair_vint_ea888_ozon_diag_20261123.py
          python -u scripts/repair_vint_ea888_ozon_diag_20261123.py
      - name: Save read-only Ozon findings
        if: always()
        run: |
          if [ -f data/repair_vint_ea888_ozon_diag_20261123.json ]; then
            bash .github/scripts/save_data.sh data/repair_vint_ea888_ozon_diag_20261123.json
          fi

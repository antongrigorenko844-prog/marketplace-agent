name: Check two Avito title batches after normal import
on:
  push:
    branches: ['audit/avito-check-nov21-titles']
    paths: ['.github/workflows/avito-check-nov21-titles.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -q -r requirements.txt
      - name: Check active titles and most recent completed report
        env:
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          from avito_client import list_all_items, _request
          import datetime, json
          targets = [[[8276437673,"Мехатроник DSG6 DQ250 с платой 02E927770AL"],[8345137262,"2 штока 101 мм 0AM325091E и 2 втулки DQ200"],[8415982473,"2 штока 99 мм 0AM325091F и 2 втулки DQ200"],[8403881830,"Датчик положения передач DQ200 для 0AM927769D/G/K"],[8404614683,"Датчик хода сцепления DQ200 для 0AM927769D/G/K"],[8403438057,"Клипсы штоков мехатроника DSG7 DQ200, 2 шт."],[8522165852,"Колодка соленоидов DQ200 для плат 0AM927769D/G/K"],[8447149597,"Гидроплита DQ200, фильтр, 2 пыльника и 2 сальника"],[8236193905,"Алюминиевые сальники толкателей DSG7 DQ200, 4 шт."],[8387549709,"Сальники штоков мехатроника DSG7 DQ200, 2 шт."],[8304174872,"Толкатели вилок DQ200 и два вида сальников, 4+4+4"]],[[8575177586,"Плата мехатроника DSG7 DQ200 0AM927769F"],[8546015515,"Плата мехатроника DSG7 DQ200 0AM927769G"],[8469152964,"Плата мехатроника DSG7 DQ200 0AM927769K"],[8433757157,"Плата мехатроника DSG7 DQ200 0AM927769E"],[8302770239,"Плата мехатроника DSG7 DQ200 0AM927769D"],[8576744875,"FPC-шлейф платы DSG7 DQ200"],[8547332649,"Шлейф электронной платы DSG7 DQ200"],[8403945697,"Основание электронной платы DSG7 DQ200"]]]
          ads = {int(x['id']): x for x in list_all_items(statuses=['active'])}
          for group in targets:
              print('TITLE_READBACK',json.dumps({'total':len(group),'active':sum(i in ads for i,_ in group),'match':sum(ads.get(i,{}).get('title')==t for i,t in group),'still_previous':[i for i,t in group if ads.get(i,{}).get('title')!=t]}))
          try:
              result = _request('GET','/autoload/v3/reports/last_completed_report')
              print('LATEST_REPORT',json.dumps({k: result.get(k) for k in ('id','report_id','status','started_at','finished_at','updated_at') if k in result}))
          except Exception as ex:
              print('REPORT_UNAVAILABLE',type(ex).__name__)
          PY

# Read-only Yandex Direct reporting. Does not create/edit campaigns, bids or ads.
name: direct-daily-report

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

concurrency:
  group: marketplace-agent
  cancel-in-progress: false

jobs:
  report:
    uses: ./.github/workflows/run-command.yml
    secrets: inherit
    with:
      command: direct-report
      save_log: true
      log_file: data/direct_daily_report_log.txt

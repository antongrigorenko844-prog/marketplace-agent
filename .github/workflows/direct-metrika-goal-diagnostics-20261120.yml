name: LEOPARTS Metrica goal URL diagnostic (read only)
on:
  push:
    branches: [main]
    paths:
      - .github/scripts/direct_metrika_goal_diagnostics_20261120.py
      - .github/workflows/direct-metrika-goal-diagnostics-20261120.yml
permissions:
  contents: write
concurrency:
  group: marketplace-agent
  cancel-in-progress: false
jobs:
  goal-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read goals and aggregated conversion totals (no writes)
        env:
          YANDEX_METRIKA_TOKEN: ${{ secrets.YANDEX_METRIKA_TOKEN }}
        run: python .github/scripts/direct_metrika_goal_diagnostics_20261120.py
      - name: Save redacted goal diagnostics
        if: always()
        run: bash .github/scripts/save_data.sh data/direct_optimization_20261120/metrika_goal_diagnostics.json

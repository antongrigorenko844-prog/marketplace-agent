name: Publish six DQ200 offers on Market and update Avito videos
on: workflow_dispatch
permissions:
  contents: write
jobs:
  market:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt
      - env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          YANDEX_MARKET_API_KEY: ${{ secrets.YANDEX_MARKET_API_KEY }}
          YANDEX_MARKET_CAMPAIGN_ID: ${{ secrets.YANDEX_MARKET_CAMPAIGN_ID }}
        run: |
          python - <<'PY'
          import yandex_market_client as ym
          ids=["0AM927769"+s for s in "GKE"]+["0am325025HX"+s for s in "GKE"]
          _,campaign=ym._creds()
          for path in (f"/v2/campaigns/{campaign}/offers",f"/v2/businesses/{ym.get_business_id()}/offer-mappings"):
              code,data=ym._request("POST",path,json_body={"offerIds":ids})
              assert code==200,data
              for p in data["result"].get("offers",[]): print("LIVE",p,flush=True)
              for row in data["result"].get("offerMappings",[]):
                  p=row["offer"]
                  print("VIDEO",p["offerId"],p.get("cardStatus"),p.get("mediaFiles",{}).get("videos"),row.get("showcaseUrls"),flush=True)
          PY

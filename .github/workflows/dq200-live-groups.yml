name: Publish six DQ200 offers on Market and update Avito videos
on: workflow_dispatch
permissions:
  contents: write
jobs:
  market:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt
      - env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          YANDEX_MARKET_API_KEY: ${{ secrets.YANDEX_MARKET_API_KEY }}
          YANDEX_MARKET_CAMPAIGN_ID: ${{ secrets.YANDEX_MARKET_CAMPAIGN_ID }}
        run: |
          python - <<'PY'
          import time
          import ozon_client as oz
          import yandex_market_client as ym
          import catalog_editor as ce
          ids=["0AM927769"+s for s in "GKE"]+["0am325025HX"+s for s in "GKE"]
          edits=ce.load_catalog_edits("data/ozon_catalog.xlsx")
          products={p["offer_id"]:p for p in oz.get_product_names(ids)}
          biz=ym.get_business_id()
          _,campaign=ym._creds()
          def call(path,body):
              code,out=ym._request("POST",path,json_body=body)
              print("HTTP",path,code,flush=True)
              assert code==200 and out.get("status")=="OK",out
              return out
          def mappings():
              out=call(f"/v2/businesses/{biz}/offer-mappings",{"offerIds":ids})
              return {p["offer"]["offerId"]:p for p in out["result"]["offerMappings"]}
          before=mappings()
          entries=[]
          for sku in ids:
              p=products[sku]
              url=next(a["values"][0]["value"] for a in p["complex_attributes"] if a["id"]==21841)
              if sku in before:
                  old=before[sku]["offer"].get("videos",[])
                  if url not in old and len(old)<6: entries.append({"offer":{"offerId":sku,"videos":old+[url]}})
                  continue
              edit=edits[sku]
              assert float(edit["price"])>0
              primary=p.get("primary_image") or []
              if isinstance(primary,str): primary=[primary]
              photos=list(dict.fromkeys(primary+p.get("images",[])))
              assert photos and edit.get("description")
              dim_factor={"mm":0.1,"cm":1}[p["dimension_unit"]]
              weight_factor={"g":0.001,"kg":1}[p["weight_unit"]]
              offer={"offerId":sku,"name":edit.get("name") or p["name"],"description":edit["description"],"pictures":photos,"videos":[url],"vendor":"Нет бренда","vendorCode":sku,"marketCategoryId":71380208,"weightDimensions":{"length":p["depth"]*dim_factor,"width":p["width"]*dim_factor,"height":p["height"]*dim_factor,"weight":p["weight"]*weight_factor},"basicPrice":{"value":float(edit["price"]),"currencyId":"RUR"}}
              if float(edit.get("old_price") or 0)>float(edit["price"]): offer["basicPrice"]["discountBase"]=float(edit["old_price"])
              entries.append({"offer":offer})
              print("NEW",sku,offer["basicPrice"],len(photos),flush=True)
          if entries:
              result=call(f"/v2/businesses/{biz}/offer-mappings/update",{"offerMappings":entries})
              print("IMPORT",result,flush=True)
              assert not any(r.get("errors") for r in result.get("results",[])),result
          for _ in range(6):
              current=mappings()
              if set(current)==set(ids): break
              time.sleep(10)
          assert set(current)==set(ids),list(current)
          print("STOCK WRITE",ym.update_stocks(dict.fromkeys(ids,5)),flush=True)
          for _ in range(8):
              try:
                  stock=call(f"/v2/campaigns/{campaign}/offers/stocks",{"offerIds":ids})
                  offers=call(f"/v2/campaigns/{campaign}/offers",{"offerIds":ids})
                  print("STOCK",stock,flush=True)
                  print("STATUS",[(o["offerId"],o["status"],o.get("basicPrice"),o.get("warnings")) for o in offers["result"]["offers"]],flush=True)
                  for sku,row in mappings().items():
                      p=row["offer"]
                      print("MEDIA",sku,p.get("mediaFiles",{}).get("videos",[]),row.get("showcaseUrls",[]),flush=True)
                  if len(offers["result"]["offers"])==6 and all(o["status"]=="PUBLISHED" for o in offers["result"]["offers"]): break
              except Exception as e: print("CHECK ERROR",e,flush=True)
              time.sleep(15)
          PY
  avito:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt
      - env:
          GH_TOKEN: ${{ github.token }}
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
        run: |
          gh release download product-photos -p avito_feed.xlsx -D /tmp
          python - <<'PY'
          from openpyxl import load_workbook
          import ozon_client as oz
          import avito_feed as av
          ids=["0AM927769"+s for s in "GKE"]+["0am325025HX"+s for s in "GKE"]
          products=oz.get_product_names(ids)
          videos={p["offer_id"]:next(a["values"][0]["value"] for a in p["complex_attributes"] if a["id"]==21841) for p in products}
          assert set(ids)==set(videos)
          book=load_workbook("/tmp/avito_feed.xlsx")
          sheet=book[av.SHEET_ADS]
          source=load_workbook("data/ozon_catalog.xlsx")
          found=set()
          for row in sheet.iter_rows(min_row=av.FIRST_DATA_ROW):
              sku=str(row[av.COL_ID-1].value or "").removesuffix(getattr(av,"AVITO_LINK_SUFFIX",""))
              if sku in videos:
                  row[av.COL_VIDEO_FILE_URL-1].value=videos[sku]
                  found.add(sku)
                  print("AVITO",sku,row[av.COL_AVITO_ID-1].value,flush=True)
          assert found, "No targeted offers in live Avito feed"
          for row in source.active.iter_rows(min_row=2):
              if row[0].value in found:
                  row[6].value=videos[row[0].value]
          book.save("/tmp/avito_feed.xlsx")
          source.save("data/ozon_catalog.xlsx")
          print("AVITO MISSING",set(ids)-found,flush=True)
          PY
          gh release upload product-photos /tmp/avito_feed.xlsx --clobber
          bash .github/scripts/save_data.sh data/ozon_catalog.xlsx

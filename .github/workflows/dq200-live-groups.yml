name: Attach DQ200 videos to G K E
on: workflow_dispatch
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt
      - env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
          YANDEX_MARKET_API_KEY: ${{ secrets.YANDEX_MARKET_API_KEY }}
          YANDEX_MARKET_CAMPAIGN_ID: ${{ secrets.YANDEX_MARKET_CAMPAIGN_ID }}
        run: |
          python - <<'PY'
          import wb_client as wb
          import yandex_market_client as ym
          ids={"0AM927769"+s for s in "DFGKE"}|{"0am325025HX"+s for s in ("","F","G","K","E")}
          for c in wb.list_cards():
              if c["vendorCode"] in ids: print("WB VIDEO",c["vendorCode"],c.get("video"),len(c.get("photos",[])),flush=True)
          try:
              print("YM ARCHIVE",[p for p in ym.get_all_offers(archived=True) if p["sku"].lower() in {s.lower() for s in ids}],flush=True)
          except Exception as e: print("YM ERROR",e,flush=True)
          PY

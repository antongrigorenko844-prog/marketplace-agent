name: LEOPARTS electronic boards separate Avito listing
on:
  push:
    branches: [main]
    paths: ['.github/workflows/avito-boards-listing-20261127.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: marketplace-agent
  cancel-in-progress: false
jobs:
  boards-listing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q -r requirements.txt
      - name: Install the reviewed rendering version and fonts
        run: |
          pip install -q Pillow==13.0.0
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSansCondensed-Bold.ttf || (sudo apt-get update -qq && sudo apt-get install -y fonts-dejavu-core fonts-dejavu-extra)
      - run: python -m py_compile scripts/avito_boards_listing_20261127.py scripts/build_avito_boards_media_20261127.py
      - name: Reproduce the reviewed photos without external writes
        run: python scripts/build_avito_boards_media_20261127.py --repo-root . --source-map data/avito_boards_media_sources_20261127.json --output data/avito_boards_media_20261127
      - name: Append one new Ad to the registered XML with all old Ad bytes preserved
        env:
          GH_TOKEN: ${{ github.token }}
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
        run: python -u scripts/avito_boards_listing_20261127.py --apply
      - name: Read ordinary scheduled autoload processing without resubmitting
        env:
          GH_TOKEN: ${{ github.token }}
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6 7 8; do
            python -u scripts/avito_boards_listing_20261127.py --readback
            if python - <<'PY'
          import json, sys
          from pathlib import Path
          result = json.loads(Path('data/avito_boards_listing_20261127_result.json').read_text())
          rows = [row for report in result.get('reports', []) for row in report.get('matches', [])]
          terminal = str(result.get('status', '')).startswith('active_') or any(
              row.get('avito_status') in ('blocked', 'rejected') or any(
                  message.get('type') == 'error' for message in row.get('messages', []))
              for row in rows)
          sys.exit(0 if terminal else 1)
          PY
            then
              break
            fi
            sleep 30
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: avito-electronic-boards-${{ github.run_id }}
          path: |
            data/avito_boards_listing_20261127_result.json
            data/avito_electronic_boards_20261127.xml
            data/avito_boards_listing_20261127_before_tools.xml
            data/avito_boards_media_20261127/
            drafts/avito_electronic_boards_20261127.json
          if-no-files-found: warn
          retention-days: 30

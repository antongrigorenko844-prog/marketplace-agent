name: Content only — verified media and text
on:
  workflow_call:
    inputs:
      mode:
        type: string
        default: ''
      descriptions_only:
        type: boolean
        default: false
      article:
        type: string
        default: ''
      api_channels:
        type: string
        default: 'ozon,wb,market'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: inspect
        options: [inspect, apply, verify]
        description: Content only; inspect and verify cannot write to marketplaces
      descriptions_only:
        type: boolean
        default: false
        description: Only descriptions of explicitly selected existing cards
      article:
        type: string
        default: ''
        description: Exact comma-separated SKUs; required for descriptions_only
      api_channels:
        type: string
        default: 'ozon,wb,market'
        description: Exact comma-separated API channels
permissions:
  contents: write
concurrency:
  group: marketplace-agent
  cancel-in-progress: false
jobs:
  content:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Remove stale local verification artifacts
        run: rm -f reports/content-sync/summary.json reports/content-sync/evidence.enc
      - name: Test the content boundary before accessing seller accounts
        env:
          TMPDIR: ${{ runner.temp }}
          DESCRIPTION_ONLY: ${{ inputs.descriptions_only }}
        run: |
          set -euo pipefail
          if [ "$DESCRIPTION_ONLY" = 'true' ]; then
            python -m unittest discover -s tests -p test_content_sync.py -v
          else
            python -m unittest discover -s tests -v
          fi
      - name: Read, plan or apply only approved content
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
          YANDEX_MARKET_API_KEY: ${{ secrets.YANDEX_MARKET_API_KEY }}
          YANDEX_MARKET_CAMPAIGN_ID: ${{ secrets.YANDEX_MARKET_CAMPAIGN_ID }}
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
          CONTENT_MODE: ${{ inputs.mode }}
          DESCRIPTION_ONLY: ${{ inputs.descriptions_only }}
          ARTICLES: ${{ inputs.article }}
          API_CHANNELS: ${{ inputs.api_channels }}
        run: |
          set -euo pipefail
          if [ "$DESCRIPTION_ONLY" = "true" ]; then
            test -n "$ARTICLES"
            if [ "$CONTENT_MODE" = "apply" ]; then
              test "$GITHUB_REF" = "refs/heads/main"
              git fetch --no-tags origin main
              cmp <(git show FETCH_HEAD:data/content_manifest.json) data/content_manifest.json
              if [ "$GITHUB_EVENT_NAME" = "push" ]; then
                cmp <(git show FETCH_HEAD:data/description_sync_request.json) data/description_sync_request.json
              fi
            fi
            python content_sync.py --descriptions-only --mode "$CONTENT_MODE" --article "$ARTICLES" --channels "$API_CHANNELS"
          elif [ -n "$CONTENT_MODE" ]; then
            python content_sync.py --mode "$CONTENT_MODE"
          else
            python content_sync.py
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-sync-${{ github.run_id }}
          path: reports/content-sync/
          retention-days: 30
      - name: Save only verification evidence, never working stock or price tables
        if: always()
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ ! -f reports/content-sync/summary.json ]; then exit 0; fi
          # Commit only evidence. The master job can legitimately have advanced
          # main since this workflow checked out its approved manifest.
          # Preserve owner changes and never replay seller writes to save a report.
          cp reports/content-sync/summary.json "$RUNNER_TEMP/content-summary.json"
          cp reports/content-sync/evidence.enc "$RUNNER_TEMP/content-evidence.enc"
          git restore --source=HEAD -- reports/content-sync/summary.json reports/content-sync/evidence.enc
          git fetch --no-tags origin "$TARGET_BRANCH"
          git checkout --detach FETCH_HEAD
          mkdir -p reports/content-sync
          cp "$RUNNER_TEMP/content-summary.json" reports/content-sync/summary.json
          cp "$RUNNER_TEMP/content-evidence.enc" reports/content-sync/evidence.enc
          bash .github/scripts/save_data.sh reports/content-sync/summary.json reports/content-sync/evidence.enc

name: LEOPARTS Direct traffic quality audit (read only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/direct-performance-audit-20261126.yml']
  workflow_dispatch:
    inputs:
      mode:
        description: "Full commercial snapshot or targeted read-only supplement"
        type: choice
        options: [full, supplement]
        default: full
permissions:
  contents: write
concurrency:
  group: direct-audit-20261126
  cancel-in-progress: false
jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read Direct and Metrica, run traffic analysis and preserve history
        env:
          YANDEX_DIRECT_TOKEN: ${{ secrets.YANDEX_DIRECT_TOKEN }}
          YANDEX_DIRECT_LOGIN: ${{ secrets.YANDEX_DIRECT_LOGIN }}
          YANDEX_METRIKA_TOKEN: ${{ secrets.YANDEX_METRIKA_TOKEN }}
        run: |
          python -m py_compile .github/scripts/direct_traffic_quality_20261126.py .github/scripts/direct_targeted_readonly_20261126.py
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" = "full" ]; then
            python -u .github/scripts/direct_traffic_quality_20261126.py
          fi
          python -u .github/scripts/direct_targeted_readonly_20261126.py
      - name: Save only this run's analytic evidence
        if: always()
        run: |
          shopt -s nullglob
          dirs=(data/direct_traffic_quality/*-${GITHUB_RUN_ID})
          if [ "${#dirs[@]}" -eq 1 ]; then
            bash .github/scripts/save_data.sh "${dirs[0]}"
          fi

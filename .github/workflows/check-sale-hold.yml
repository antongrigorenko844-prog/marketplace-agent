name: Verify the paused SKU across sales exports
on:
  push:
    branches: ["audit/paused-offer-stock-projection-20261121"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*publication*.py'
      - run: python -m unittest discover -s tests -p 'test_paused_sales.py'

name: LEOPARTS approved Direct filters prices and negatives Nov24
on:
  push:
    branches: [main]
    paths: ['.github/workflows/direct-owner-approved-20261124.yml']
permissions:
  contents: write
concurrency:
  group: marketplace-agent
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q -r requirements.txt
      - name: Apply only approved scope and verify readbacks
        env:
          YANDEX_DIRECT_TOKEN: ${{ secrets.YANDEX_DIRECT_TOKEN }}
          YANDEX_DIRECT_LOGIN: ${{ secrets.YANDEX_DIRECT_LOGIN }}
          YANDEX_METRIKA_TOKEN: ${{ secrets.YANDEX_METRIKA_TOKEN }}
        run: |
          python -m py_compile .github/scripts/direct_owner_approved_20261124.py
          python -u .github/scripts/direct_owner_approved_20261124.py
      - name: Save final journal
        if: always()
        run: |
          if test -f data/direct_recovery_20261124/owner_approved_changes.json; then
            bash .github/scripts/save_data.sh data/direct_recovery_20261124/owner_approved_changes.json
          fi

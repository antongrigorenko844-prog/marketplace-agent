name: LEOPARTS approved description request
on:
  push:
    branches: [main]
    paths:
      - data/description_sync_request.json
permissions:
  contents: write
jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.request.outputs.mode }}
      articles: ${{ steps.request.outputs.articles }}
      api: ${{ steps.request.outputs.api }}
      api_channels: ${{ steps.request.outputs.api_channels }}
      api_articles: ${{ steps.request.outputs.api_articles }}
      auxiliary: ${{ steps.request.outputs.auxiliary }}
      diagnose: ${{ steps.request.outputs.diagnose }}
      master: ${{ steps.request.outputs.master }}
    steps:
      - uses: actions/checkout@v4
      - id: request
        name: Validate explicit exact SKU request without seller access
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          request = json.loads(Path('data/description_sync_request.json').read_text())
          manifest = json.loads(Path('data/content_manifest.json').read_text())['products']
          mode = request.get('mode')
          channels = request.get('channels', ['api'])
          if not isinstance(channels, list) or not channels or any(c not in {'api','ozon','wb','market','avito','tilda','ozon_diagnose','tilda_canary','master'} for c in channels):
              raise SystemExit('Invalid channel scope')
          skus = request.get('skus')
          if 'ozon_diagnose' in channels and mode != 'inspect':
              raise SystemExit('Ozon diagnostics are read only')
          if mode not in {'inspect', 'verify', 'apply'}:
              raise SystemExit('Invalid mode')
          if not isinstance(skus, list) or not skus or len(skus) > 50:
              raise SystemExit('Explicit list of 1–50 SKUs required')
          if any(not isinstance(s, str) or not s or s != s.strip() or any(c in s for c in ',\r\n') or s not in manifest for s in skus):
              raise SystemExit('Invalid or unknown SKU')
          if 'tilda_canary' in channels and (channels!=['tilda_canary'] or len(skus)!=1 or mode!='apply'):
              raise SystemExit('Tilda canary must be one exact existing SKU')
          if len(skus) != len(set(skus)) or len(channels)!=len(set(channels)):
              raise SystemExit('Duplicate SKU or channel')
          api = [c for c in ('ozon','wb','market') if c in channels or 'api' in channels]
          api_skus = [s for s in skus if any(manifest[s].get('text',{}).get(c,{}).get('description') for c in api)]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print('mode='+mode, file=out)
              print('articles='+','.join(skus), file=out)
              print('api='+str(bool(api_skus)).lower(), file=out)
              print('api_channels='+','.join(api), file=out)
              print('api_articles='+','.join(api_skus), file=out)
              print('auxiliary='+','.join(c for c in channels if c in {'avito','tilda','tilda_canary'}), file=out)
              print('diagnose='+str('ozon_diagnose' in channels).lower(), file=out)
              print('master='+str('master' in channels).lower(), file=out)
          PY
  descriptions:
    needs: scope
    if: needs.scope.outputs.api == 'true'
    uses: ./.github/workflows/content-sync.yml
    with:
      descriptions_only: true
      mode: ${{ needs.scope.outputs.mode }}
      article: ${{ needs.scope.outputs.api_articles }}
      api_channels: ${{ needs.scope.outputs.api_channels }}
    secrets: inherit

  auxiliary:
    needs: [scope, descriptions]
    if: always() && needs.scope.result == 'success' && needs.scope.outputs.auxiliary != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: marketplace-agent
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_content_aux_sync.py -v
      - name: Remove stale local reports
        run: rm -f reports/content-aux/summary.json reports/content-aux/tilda_description_update.csv
      - name: Verify or publish approved auxiliary descriptions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
          TILDA_COMMERCEML_URL: ${{ needs.scope.outputs.auxiliary == 'tilda_canary' && secrets.TILDA_COMMERCEML_URL || '' }}
          TILDA_COMMERCEML_USER: ${{ needs.scope.outputs.auxiliary == 'tilda_canary' && secrets.TILDA_COMMERCEML_USER || '' }}
          TILDA_COMMERCEML_PASSWORD: ${{ needs.scope.outputs.auxiliary == 'tilda_canary' && secrets.TILDA_COMMERCEML_PASSWORD || '' }}
          MODE: ${{ needs.scope.outputs.mode }}
          ARTICLES: ${{ needs.scope.outputs.articles }}
          CHANNELS: ${{ needs.scope.outputs.auxiliary }}
        run: |
          set -euo pipefail
          if [ "$MODE" = 'apply' ]; then
            test "$GITHUB_REF" = 'refs/heads/main'
            git fetch --no-tags origin main
            cmp <(git show FETCH_HEAD:data/content_manifest.json) data/content_manifest.json
            cmp <(git show FETCH_HEAD:data/description_sync_request.json) data/description_sync_request.json
            if [[ "$CHANNELS" == *avito* ]]; then
              cmp <(git show FETCH_HEAD:data/avito_feed.xlsx) data/avito_feed.xlsx
            fi
          fi
          python content_aux_sync.py --mode "$MODE" --article "$ARTICLES" --channels "$CHANNELS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-aux-${{ github.run_id }}
          path: reports/content-aux/
          retention-days: 30
      - name: Preserve auxiliary verification report
        if: always()
        run: |
          if [ -f reports/content-aux/summary.json ]; then
            files=(reports/content-aux/summary.json)
            if [ -f reports/content-aux/tilda_description_update.csv ]; then files+=(reports/content-aux/tilda_description_update.csv); fi
            bash .github/scripts/save_data.sh "${files[@]}"
          fi

  ozon_diagnosis:
    needs: [scope, descriptions, auxiliary]
    if: always() && needs.scope.result == 'success' && needs.scope.outputs.diagnose == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: marketplace-agent
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_content*.py' -v
      - name: Read-only Ozon attribute investigation
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          ARTICLES: ${{ needs.scope.outputs.articles }}
        run: python content_ozon_diagnosis.py --article "$ARTICLES"
      - name: Save diagnostics
        if: always()
        run: |
          if [ -f reports/content-ozon-diagnosis/summary.json ]; then
            bash .github/scripts/save_data.sh reports/content-ozon-diagnosis/summary.json
          fi

  master:
    needs: scope
    if: needs.scope.outputs.master == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: marketplace-agent
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_content_master_sync.py -v
      - name: Materialize only approved description cells
        env:
          MODE: ${{ needs.scope.outputs.mode }}
          ARTICLES: ${{ needs.scope.outputs.articles }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          cmp <(git show FETCH_HEAD:data/content_manifest.json) data/content_manifest.json
          cmp <(git show FETCH_HEAD:data/description_sync_request.json) data/description_sync_request.json
          git checkout --detach FETCH_HEAD
          python content_master_sync.py --mode "$MODE" --article "$ARTICLES"
          if [ "$MODE" = apply ]; then
            git add -- data/master_control.xlsx data/ozon_catalog.xlsx data/ozon_new_products.xlsx data/wb_catalog.xlsx data/wb_new_products.xlsx
            git config user.name marketplace-agent-bot
            git config user.email actions@users.noreply.github.com
            if ! git diff --cached --quiet; then
              git commit -m "chore: materialize approved descriptions only [skip ci]"
              git push origin HEAD:main
            fi
          fi
      - name: Save master report
        if: always()
        run: |
          if [ -f reports/content-master/summary.json ]; then
            bash .github/scripts/save_data.sh reports/content-master/summary.json
          fi

name: direct-negatives-safety-rollback
on:
  push:
    branches: [main]
    paths: ['.github/agent-requests/direct-negatives-safety-rollback.txt']
permissions:
  contents: write
concurrency:
  group: marketplace-agent
  cancel-in-progress: false
jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Remove risky broad negatives and verify
        env:
          YANDEX_DIRECT_TOKEN: ${{ secrets.YANDEX_DIRECT_TOKEN }}
          YANDEX_DIRECT_LOGIN: ${{ secrets.YANDEX_DIRECT_LOGIN }}
        run: python .github/scripts/direct_negatives_safety_rollback.py
      - name: Save result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/direct_negatives_safety_rollback.txt
          git diff --cached --quiet || (git commit -m "Verify safety rollback of broad negatives" && git pull --rebase && git push)

name: LEOPARTS DQ250 DQ500 direct site and Avito prices 20261122
on:
  push:
    branches: [main]
    paths:
      - 'data/approved_filters_direct_20261122.json'
permissions:
  contents: write
concurrency:
  group: marketplace-agent
  cancel-in-progress: false
jobs:
  approved:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -q --disable-pip-version-check -r requirements.txt
      - name: Validate exact six SKU approved prices
        run: |
          python -m py_compile scripts/approved_filters_direct_20261122.py
          python scripts/approved_filters_direct_20261122.py stage
      - name: Save approved site and Avito price sources
        run: |
          bash .github/scripts/save_data.sh \
            data/avito_site_price_overrides.xlsx \
            data/avito_feed.xlsx \
            data/approved_filters_direct_20261122_result.json
      - name: Publish just six approved site and Avito prices
        env:
          GH_TOKEN: ${{ github.token }}
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
          TILDA_COMMERCEML_URL: ${{ secrets.TILDA_COMMERCEML_URL }}
          TILDA_COMMERCEML_USER: ${{ secrets.TILDA_COMMERCEML_USER }}
          TILDA_COMMERCEML_PASSWORD: ${{ secrets.TILDA_COMMERCEML_PASSWORD }}
        run: python scripts/approved_filters_direct_20261122.py publish
      - name: Save live verification
        if: always()
        run: |
          if [ -f data/approved_filters_direct_20261122_result.json ]; then
            bash .github/scripts/save_data.sh data/approved_filters_direct_20261122_result.json
          fi

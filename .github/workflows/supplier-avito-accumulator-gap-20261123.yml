name: LEOPARTS original DQ200 accumulator Avito availability audit read only
on:
  push:
    branches: [main]
    paths:
      - 'data/supplier_avito_accumulator_gap_20261123_request.json'
permissions:
  contents: write
concurrency:
  group: marketplace-agent
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q -r requirements.txt
      - name: Read exact one SKU from local and stable Avito feed and seller account
        env:
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
        run: python -u scripts/supplier_avito_accumulator_gap_20261123.py
      - name: Save read-only summary
        if: always()
        run: |
          if [ -f data/supplier_avito_accumulator_gap_20261123_result.json ]; then
            bash .github/scripts/save_data.sh data/supplier_avito_accumulator_gap_20261123_result.json
          fi

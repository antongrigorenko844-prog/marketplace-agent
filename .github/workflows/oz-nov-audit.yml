name: Ozon search queries audit (read only)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt
      - env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
        run: |
          python - <<'PY'
          import json,time,os
          from pathlib import Path
          import ozon_client as oz
          D=Path('ozon-search-audit');D.mkdir(exist_ok=True)
          offers=['0am325025H','0am325025','0am325025x','0AM325587E','0AM927769D','0am325025HX','02E927770AL','0am325091e-set','0am325091f-set','0AM325025B']
          infos=oz.get_product_info_list(offers)
          for p in infos:
           body={'date_from':'2026-10-16T00:00:00Z','date_to':'2026-11-12T23:59:59Z','skus':[str(p['sku'])],'limit_by_sku':15,'page':0,'page_size':100,'sort_by':'BY_SEARCHES','sort_dir':'DESCENDING'}
           try:r=oz._post('/v1/analytics/product-queries/details',body)
           except Exception as e:r={'error':str(e)[:1800]}
           (D/(p['offer_id']+'.json')).write_text(json.dumps(r,ensure_ascii=False),encoding='utf8')
           print(p['offer_id'],'done',flush=True);time.sleep(2)
          
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ozon-search-audit
          path: ozon-search-audit/
          retention-days: 7


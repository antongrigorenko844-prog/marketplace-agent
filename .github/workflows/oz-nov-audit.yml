name: Ozon reviews audit (read only)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt
      - env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
        run: |
          python - <<'PY'
          import json,time
          from pathlib import Path
          import ozon_client as oz
          D=Path('ozon-reviews-audit');D.mkdir(exist_ok=True)
          last=''
          for i in range(12):
           body={'status':'ALL','limit':100,'sort_dir':'DESC'}
           if last:body['last_id']=last
           try:r=oz._post('/v1/review/list',body)
           except Exception as e:
            (D/'error.json').write_text(json.dumps({'error':str(e)[:1800]},ensure_ascii=False));break
           (D/f'reviews_{i}.json').write_text(json.dumps(r,ensure_ascii=False))
           print('page',i,'reviews',len(r.get('reviews',[])),flush=True)
           newlast=r.get('last_id')
           if not r.get('has_next') or not newlast or newlast==last:break
           last=newlast;time.sleep(2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ozon-reviews-audit
          path: ozon-reviews-audit/
          retention-days: 7

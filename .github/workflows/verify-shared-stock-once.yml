name: Чтение шести остатков Авито после складского цикла
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-shared-stock-once.yml']
permissions:
  contents: read
jobs:
  compare:
    if: github.event.before == 'b7e5d39698fc4a997121d1fcd17f632be883566c' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Сравнить данные каталога и свежий ответ Avito
        env:
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from avito_stock import targets
          from avito_stock_client import StockClient
          local, _ = targets(Path("data"))
          client = StockClient()
          measured = {}
          for sku in local:
              client.verify_listing(sku)
              measured[sku] = client.read(sku)
          print(json.dumps({"warehouse": local, "avito": measured, "match": measured == local}, sort_keys=True))
          raise SystemExit(0 if local == measured else 1)
          PY

name: Inspect approved sales improvement plan
on: workflow_dispatch
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt
      - env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
          YANDEX_MARKET_API_KEY: ${{ secrets.YANDEX_MARKET_API_KEY }}
          YANDEX_MARKET_CAMPAIGN_ID: ${{ secrets.YANDEX_MARKET_CAMPAIGN_ID }}
        run: python scripts/growth_plan_inspect.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: growth-plan-evidence
          path: /tmp/growth-plan-evidence/

name: LEOPARTS backfill titles descriptions and hashtags for legacy videos
on:
  push:
    branches: [main]
    paths: ['.github/workflows/designer-video-copy-backfill.yml']
permissions:
  contents: write
concurrency:
  group: marketplace-agent-designer-video
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Check video copy against reviewed files and source keywords
        run: python -m unittest discover -s tests -p test_video_copy.py -v
      - name: Deliver text-only catch-up to original designer chat, no videos resent
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python designer_video_backfill.py

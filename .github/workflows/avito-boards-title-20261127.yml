name: LEOPARTS existing board listing full title only
on:
  push:
    branches: [main]
    paths: ['.github/workflows/avito-boards-title-20261127.yml']
  workflow_dispatch:
    inputs:
      mode:
        description: Apply the approved title or read its current status
        type: choice
        options: [readback, apply]
        default: readback
permissions:
  contents: write
concurrency:
  group: marketplace-agent
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'push' || inputs.mode == 'apply'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q -r requirements.txt
      - name: Rename only the existing listing title
        env:
          GH_TOKEN: ${{ github.token }}
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
        run: python -u scripts/rename_avito_boards_title_20261128.py --apply
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: avito-board-title-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/avito_boards_title_20261128*.json
            data/avito_boards_title_20261128*.xml
          retention-days: 30
  readback:
    needs: publish
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q -r requirements.txt
      - name: Read back the existing feed and listing
        env:
          GH_TOKEN: ${{ github.token }}
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
        run: python -u scripts/rename_avito_boards_title_20261128.py --readback
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: avito-board-title-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/avito_boards_title_20261128_result.json
          retention-days: 30

name: LEOPARTS audit legacy order recipe gaps (read only)
on:
  push:
    branches: [main]
    paths: ['data/stock_recipe_gap_audit_20261123_request.json']
permissions: {contents: write}
concurrency: {group: marketplace-agent, cancel-in-progress: false}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Inspect order ledger snapshot without writes
        run: python -u scripts/stock_recipe_gap_audit_20261123.py
      - name: Save read-only audit
        if: always()
        run: bash .github/scripts/save_data.sh data/stock_recipe_gap_audit_20261123_result.json

name: LEOPARTS check Avito 6T30 auto-import status (read only)
on:
  push:
    branches: [main]
    paths: ['data/6t30_avito_import_check_20261123_request.json']
permissions: {contents: write}
concurrency: {group: marketplace-agent, cancel-in-progress: false}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q -r requirements.txt
      - name: Read only Avito auto-load status, no item writes
        env:
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          import sys,json
          from pathlib import Path
          import avito_client as av
          o={'sku':'6t30','read_only':True,'avito_id':8425207775}
          for label,path in [('autoload_profile','/autoload/v2/profile'),('last_completed_report','/autoload/v3/reports/last_completed_report')]:
              try:
                  d=av._request('GET',path)
                  def sanitize(obj,depth=0):
                      if depth>2:return str(type(obj).__name__)
                      if isinstance(obj,dict):
                          return {k:sanitize(v,depth+1) for k,v in obj.items() if k in {'status','enabled','active','paused','schedule','updatedAt','createdAt','date','startTime','endTime','fileName','name','message','error','errors','progress','lastRun','lastRunDate','lastRunStatus','total','success','failed','report','result','data','autoLoadEnabled','autoloadEnabled','nextRun'}}
                      if isinstance(obj,list):return [sanitize(v,depth+1) for v in obj[:5]]
                      if isinstance(obj,(str,int,float,bool,type(None))):return str(obj)[:140]
                      return str(type(obj).__name__)
                  o[label]={'accessible':True,'fields':list(d)[:20],'safe_subset':sanitize(d)}
              except Exception as e:o[label]={'accessible':False,'error_type':type(e).__name__,'error_message':str(e)[:220]}
          Path('data/6t30_avito_import_check_20261123_result.json').write_text(json.dumps(o,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(o,ensure_ascii=False),flush=True)
          PY
      - name: Save status
        if: always()
        run: bash .github/scripts/save_data.sh data/6t30_avito_import_check_20261123_result.json

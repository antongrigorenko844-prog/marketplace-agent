name: LEOPARTS publish APPROVED 6T30 Gen1 cover (exact SKU only)
on:
  push:
    branches: [main]
    paths:
      - 'data/6t30_cover_publish_20261123_request.json'
permissions: {contents: write}
concurrency: {group: marketplace-agent, cancel-in-progress: false}
jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install dependencies
        run: |
          pip install -q -r requirements.txt
          pip install -q pillow
      - name: Apply owner-approved image to exact 6t30 only and verify
        env:
          GH_TOKEN: ${{ github.token }}
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
          YANDEX_MARKET_API_KEY: ${{ secrets.YANDEX_MARKET_API_KEY }}
          YANDEX_MARKET_CAMPAIGN_ID: ${{ secrets.YANDEX_MARKET_CAMPAIGN_ID }}
          TILDA_COMMERCEML_URL: ${{ secrets.TILDA_COMMERCEML_URL }}
          TILDA_COMMERCEML_USER: ${{ secrets.TILDA_COMMERCEML_USER }}
          TILDA_COMMERCEML_PASSWORD: ${{ secrets.TILDA_COMMERCEML_PASSWORD }}
        run: |
          python -m py_compile scripts/approved_6t30_gen1_cover_20261123.py
          python -u scripts/approved_6t30_gen1_cover_20261123.py
      - name: Keep exact-SKU source images, catalog pins, feed and channel status
        if: always()
        run: |
          bash .github/scripts/save_data.sh data/ photos/6t30/ photos_avito/6t30/

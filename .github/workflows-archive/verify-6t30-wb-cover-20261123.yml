name: LEOPARTS verify 6T30 Gen1 cover on WB (read only)
on:
  push:
    branches: [main]
    paths: ['data/6t30_wb_verify_20261123_request.json']
permissions: {contents: write}
concurrency: {group: marketplace-agent, cancel-in-progress: false}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q -r requirements.txt
      - name: Read only WB image and compare to approved cover
        env:
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
        run: python -u scripts/verify_6t30_wb_cover_20261123.py
      - name: Save image proof and report
        if: always()
        run: bash .github/scripts/save_data.sh data/6t30_wb_cover_20261123_result.json data/6t30_wb_cover_20261123_preview.b64

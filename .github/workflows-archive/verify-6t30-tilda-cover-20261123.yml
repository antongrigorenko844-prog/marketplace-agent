name: LEOPARTS verify Tilda 6T30 Gen1 cover (read only)
on:
  push:
    branches: [main]
    paths: ['data/6t30_tilda_cover_verify_20261123_request.json']
permissions: {contents: write}
concurrency: {group: marketplace-agent, cancel-in-progress: false}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q -r requirements.txt
      - name: Verify live Tilda product image only
        run: |
          python - <<'PY'
          import json,requests,io,sys,time
          from pathlib import Path
          from PIL import Image,ImageChops,ImageStat
          from scripts.leoparts_direct_operation_nov21 import site_records
          result={'sku':'6t30','read_only':True}
          try:
              rows=[r for r in site_records().values() if r.get('sku')=='6t30']
              if len(rows)!=1:raise RuntimeError('Expected one site SKU')
              p=rows[0]
              g=p.get('gallery') or []
              result.update(uid=str(p.get('uid')),gallery_type=type(g).__name__,gallery_length_raw=len(g),title=p.get('title'))
              if isinstance(g,str):
                  try:g=json.loads(g)
                  except (ValueError,TypeError):result['gallery_prefix']=g[:220];g=[g]
              result['parsed_gallery_type']=type(g).__name__
              result['parsed_gallery_count']=len(g) if hasattr(g,'__len__') else None
              def pick(v):
                  if isinstance(v,str):
                      if v.startswith('https://'):return v
                      try:return pick(json.loads(v))
                      except (ValueError,TypeError):return None
                  if isinstance(v,dict):
                      for k in ('img','url','original','src','image','photo'):
                          u=v.get(k)
                          if u:
                              hit=pick(u)
                              if hit:return hit
                      for w in v.values():
                          hit=pick(w)
                          if hit:return hit
                  if isinstance(v,list):
                      for w in v:
                          hit=pick(w)
                          if hit:return hit
                  return None
              first=pick(g[0] if isinstance(g,list) and g else g)
              result['first_url']=first
              if not first:raise RuntimeError('No first image URL in live gallery')
              raw=requests.get(first,headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'},params={'v':str(time.time_ns())},timeout=40)
              raw.raise_for_status()
              live=Image.open(io.BytesIO(raw.content)).convert('RGB')
              approved=Image.open('photos/6t30/6t30_1.png').convert('RGB')
              result['image_size']=live.size
              a=approved.resize((240,320),Image.Resampling.LANCZOS)
              b=live.resize((240,320),Image.Resampling.LANCZOS)
              result['mean_pixel_difference']=round(sum(ImageStat.Stat(ImageChops.difference(a,b)).mean)/3,2)
              result['cover_matches']=result['mean_pixel_difference']<16
          except Exception as e:result['error']=type(e).__name__+': '+str(e)[:420]
          Path('data/6t30_tilda_cover_verify_20261123_result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(result,ensure_ascii=False),flush=True)
          sys.exit(0 if result.get('cover_matches') else 1)
          PY
      - name: Save read-only Tilda audit
        if: always()
        run: bash .github/scripts/save_data.sh data/6t30_tilda_cover_verify_20261123_result.json
